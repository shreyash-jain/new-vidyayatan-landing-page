<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" role="img" aria-label="Abstract graphic: a tall stack of build cost blocks beside a low flat licence line, with a recurring maintenance band extending away from the stack">
  <defs>
    <linearGradient id="wa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#161431" />
      <stop offset="100%" stop-color="#2b2e7c" />
    </linearGradient>
    <linearGradient id="wa-build" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.85" />
    </linearGradient>
    <radialGradient id="wa-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#wa-bg)" />
  <circle cx="330" cy="330" r="300" fill="url(#wa-glow)" />

  <!-- baseline -->
  <rect x="110" y="500" width="980" height="2" fill="#7dd3fc" fill-opacity="0.28" />

  <!-- the build: a tall stack of segments -->
  <g>
    <rect x="150" y="150" width="180" height="54" rx="10" fill="url(#wa-build)" fill-opacity="0.55" />
    <rect x="150" y="212" width="180" height="54" rx="10" fill="url(#wa-build)" fill-opacity="0.65" />
    <rect x="150" y="274" width="180" height="54" rx="10" fill="url(#wa-build)" fill-opacity="0.75" />
    <rect x="150" y="336" width="180" height="54" rx="10" fill="url(#wa-build)" fill-opacity="0.85" />
    <rect x="150" y="398" width="180" height="54" rx="10" fill="url(#wa-build)" fill-opacity="0.95" />
    <rect x="150" y="460" width="180" height="34" rx="10" fill="url(#wa-build)" />
  </g>

  <!-- maintenance: a repeating band trailing to the right, never ending -->
  <g fill="#fbbf24" fill-opacity="0.42">
    <rect x="360" y="452" width="58" height="42" rx="8" />
    <rect x="432" y="452" width="58" height="42" rx="8" fill-opacity="0.36" />
    <rect x="504" y="452" width="58" height="42" rx="8" fill-opacity="0.30" />
    <rect x="576" y="452" width="58" height="42" rx="8" fill-opacity="0.24" />
    <rect x="648" y="452" width="58" height="42" rx="8" fill-opacity="0.18" />
    <rect x="720" y="452" width="58" height="42" rx="8" fill-opacity="0.12" />
  </g>

  <!-- the licence line: low and flat, running the full width -->
  <rect x="820" y="474" width="240" height="20" rx="10" fill="#38bdf8" fill-opacity="0.85" />
  <rect x="820" y="440" width="240" height="20" rx="10" fill="#38bdf8" fill-opacity="0.45" />

  <!-- scale ticks along the left, implying magnitude -->
  <g fill="#7dd3fc" fill-opacity="0.30">
    <rect x="110" y="160" width="24" height="3" rx="1.5" />
    <rect x="110" y="245" width="24" height="3" rx="1.5" />
    <rect x="110" y="330" width="24" height="3" rx="1.5" />
    <rect x="110" y="415" width="24" height="3" rx="1.5" />
    <rect x="110" y="497" width="24" height="3" rx="1.5" />
  </g>
</svg>
