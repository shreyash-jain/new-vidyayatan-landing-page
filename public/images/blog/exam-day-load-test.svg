<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" role="img" aria-label="Abstract graphic: a dense field of small dots representing a thousand simultaneous test-takers converges into a narrow channel, above a flat response-time line with two marked anomalies">
  <defs>
    <linearGradient id="ed-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#161431" />
      <stop offset="100%" stop-color="#2b2e7c" />
    </linearGradient>
    <radialGradient id="ed-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ed-funnel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.30" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ed-bg)" />
  <circle cx="820" cy="290" r="320" fill="url(#ed-glow)" />

  <!-- converging channel -->
  <path d="M 120 96 L 860 268 L 860 332 L 120 504 Z" fill="url(#ed-funnel)" />
  <path d="M 120 96 L 860 268" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="2" fill="none" />
  <path d="M 120 504 L 860 332" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="2" fill="none" />

  <!-- the field of learners: rows of dots, denser toward the mouth -->
  <g fill="#7dd3fc" fill-opacity="0.75">
    <circle cx="146" cy="122" r="5" /><circle cx="196" cy="140" r="5" /><circle cx="246" cy="158" r="5" /><circle cx="296" cy="176" r="5" />
    <circle cx="346" cy="194" r="5" /><circle cx="396" cy="212" r="5" /><circle cx="446" cy="230" r="5" /><circle cx="496" cy="248" r="5" />
    <circle cx="160" cy="186" r="5" /><circle cx="210" cy="198" r="5" /><circle cx="260" cy="210" r="5" /><circle cx="310" cy="222" r="5" />
    <circle cx="360" cy="234" r="5" /><circle cx="410" cy="246" r="5" /><circle cx="460" cy="258" r="5" /><circle cx="510" cy="270" r="5" />
    <circle cx="150" cy="252" r="5" /><circle cx="200" cy="258" r="5" /><circle cx="250" cy="264" r="5" /><circle cx="300" cy="270" r="5" />
    <circle cx="350" cy="276" r="5" /><circle cx="400" cy="282" r="5" /><circle cx="450" cy="288" r="5" /><circle cx="500" cy="294" r="5" />
    <circle cx="150" cy="348" r="5" /><circle cx="200" cy="342" r="5" /><circle cx="250" cy="336" r="5" /><circle cx="300" cy="330" r="5" />
    <circle cx="350" cy="324" r="5" /><circle cx="400" cy="318" r="5" /><circle cx="450" cy="312" r="5" /><circle cx="500" cy="306" r="5" />
    <circle cx="160" cy="414" r="5" /><circle cx="210" cy="402" r="5" /><circle cx="260" cy="390" r="5" /><circle cx="310" cy="378" r="5" />
    <circle cx="360" cy="366" r="5" /><circle cx="410" cy="354" r="5" /><circle cx="460" cy="342" r="5" /><circle cx="510" cy="330" r="5" />
    <circle cx="146" cy="478" r="5" /><circle cx="196" cy="460" r="5" /><circle cx="246" cy="442" r="5" /><circle cx="296" cy="424" r="5" />
    <circle cx="346" cy="406" r="5" /><circle cx="396" cy="388" r="5" /><circle cx="446" cy="370" r="5" /><circle cx="496" cy="352" r="5" />
  </g>

  <g fill="#7dd3fc" fill-opacity="0.95">
    <circle cx="560" cy="266" r="5" /><circle cx="600" cy="278" r="5" /><circle cx="640" cy="286" r="5" /><circle cx="680" cy="292" r="5" />
    <circle cx="560" cy="300" r="5" /><circle cx="600" cy="302" r="5" /><circle cx="640" cy="304" r="5" /><circle cx="680" cy="306" r="5" />
    <circle cx="560" cy="334" r="5" /><circle cx="600" cy="326" r="5" /><circle cx="640" cy="318" r="5" /><circle cx="680" cy="312" r="5" />
    <circle cx="720" cy="296" r="5" /><circle cx="720" cy="308" r="5" /><circle cx="760" cy="300" r="5" /><circle cx="800" cy="302" r="5" />
  </g>

  <!-- the mouth -->
  <rect x="856" y="262" width="10" height="76" rx="5" fill="#fbbf24" fill-opacity="0.9" />

  <!-- flat response line with two anomaly markers -->
  <path d="M 120 566 L 1080 566" stroke="#7dd3fc" stroke-opacity="0.30" stroke-width="2" fill="none" />
  <path d="M 120 566 L 640 566 L 668 566 L 700 566 L 1080 566" stroke="#38bdf8" stroke-opacity="0.85" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="668" cy="566" r="11" fill="none" stroke="#f87171" stroke-opacity="0.9" stroke-width="3" />
  <circle cx="884" cy="566" r="11" fill="none" stroke="#f87171" stroke-opacity="0.9" stroke-width="3" />
</svg>
