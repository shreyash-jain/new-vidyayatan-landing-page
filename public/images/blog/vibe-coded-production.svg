<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="cyan-glow-p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-grad-p)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <circle cx="600" cy="270" r="260" fill="url(#cyan-glow-p)" />

  <!-- 7-Point Checklist Modal Graphic -->
  <g transform="translate(320, 110)">
    <rect width="560" height="400" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="url(#gold-grad)" stroke-width="2.5" />
    <rect width="560" height="52" rx="20" fill="#1e293b" />
    
    <text x="30" y="32" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Production Readiness Checklist (7 Pillars)</text>
    <rect x="410" y="14" width="125" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
    <text x="422" y="31" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">★ CERTIFIED</text>

    <!-- Checklist Items Grid -->
    <g transform="translate(30, 80)">
      <!-- 1 -->
      <circle cx="15" cy="15" r="12" fill="#10b981" />
      <path d="M10 15 L14 19 L20 11" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="38" y="20" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">1. Security &amp; Authorization (RLS + JWT Hygiene)</text>
      
      <!-- 2 -->
      <circle cx="15" cy="55" r="12" fill="#10b981" />
      <path d="M10 55 L14 59 L20 51" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="38" y="60" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">2. Global Error Boundaries &amp; Fallback UIs</text>

      <!-- 3 -->
      <circle cx="15" cy="95" r="12" fill="#10b981" />
      <path d="M10 95 L14 99 L20 91" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="38" y="100" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">3. Rate Limiting &amp; DDoS Prevention (Redis/WAF)</text>

      <!-- 4 -->
      <circle cx="15" cy="135" r="12" fill="#10b981" />
      <path d="M10 135 L14 139 L20 131" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="38" y="140" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">4. ACID Database Transactions</text>

      <!-- 5 -->
      <circle cx="15" cy="175" r="12" fill="#10b981" />
      <path d="M10 175 L14 179 L20 171" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="38" y="180" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">5. Performance &amp; Bundle Size Optimization (90+ score)</text>

      <!-- 6 -->
      <circle cx="15" cy="215" r="12" fill="#10b981" />
      <path d="M10 215 L14 219 L20 211" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="38" y="220" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">6. Automated Database Backups &amp; PITR</text>

      <!-- 7 -->
      <circle cx="15" cy="255" r="12" fill="#10b981" />
      <path d="M10 255 L14 259 L20 251" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="38" y="260" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">7. Real-Time Observability &amp; Sentry Alerting</text>
    </g>
  </g>

  <text x="600" y="580" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="600">Vidyayatan Engineering • Is Your Vibe Coded App Production Grade?</text>
