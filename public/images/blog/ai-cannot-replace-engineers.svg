<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" role="img" aria-label="Abstract graphic: interlocking structural rings holding a load-bearing keystone">
  <defs>
    <linearGradient id="r-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="55%" stop-color="#141b33" />
      <stop offset="100%" stop-color="#2b2e7c" />
    </linearGradient>
    <linearGradient id="r-key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5" />
    </linearGradient>
    <radialGradient id="r-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#r-bg)" />
  <circle cx="600" cy="315" r="300" fill="url(#r-glow)" />

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 157 H1200 M0 315 H1200 M0 473 H1200" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" />
  </g>

  <!-- Four interlocking rings: the structure only holds because they overlap -->
  <g fill="none" stroke-width="3">
    <circle cx="440" cy="250" r="132" stroke="#34d399" stroke-opacity="0.5" />
    <circle cx="760" cy="250" r="132" stroke="#6ee7b7" stroke-opacity="0.42" />
    <circle cx="600" cy="410" r="132" stroke="#38bdf8" stroke-opacity="0.4" />
    <circle cx="600" cy="250" r="196" stroke="#ffffff" stroke-opacity="0.1" stroke-dasharray="8 12" />
  </g>

  <!-- Keystone at the intersection -->
  <g transform="translate(600, 303)">
    <path d="M0 -58 L52 -29 L52 29 L0 58 L-52 29 L-52 -29 Z" fill="url(#r-key)" stroke="#d1fae5" stroke-opacity="0.7" stroke-width="2.5" />
    <path d="M0 -30 L27 -15 L27 15 L0 30 L-27 15 L-27 -15 Z" fill="#0a0f1d" fill-opacity="0.55" />
    <circle cx="0" cy="0" r="8" fill="#ecfdf5" />
  </g>

  <g stroke="#6ee7b7" stroke-opacity="0.3" stroke-width="1.5">
    <path d="M440 250 L600 303 L760 250 L600 410 Z" fill="none" />
  </g>
  <g fill="#6ee7b7">
    <circle cx="440" cy="250" r="8" />
    <circle cx="760" cy="250" r="8" />
    <circle cx="600" cy="410" r="8" />
  </g>
</svg>
