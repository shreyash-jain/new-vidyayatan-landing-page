<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="The AI productivity gap, from McKinsey's State of AI 2026 survey. 80% of people who use AI at work say it has improved their productivity. Only 37% of organisations report any effect of AI on profit (EBIT). Faster people have not yet become faster businesses.">
  <rect width="880" height="470" fill="#ffffff" />
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c">Faster people, not yet faster businesses</text>
    <text x="30" y="74" font-size="18" fill="#6b7194">What AI users report, compared with what their organisations report</text>

    <!-- tile 1 -->
    <rect x="30" y="104" width="400" height="280" rx="16" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" />
    <text x="60" y="150" font-size="18" font-weight="700" fill="#0369a1" letter-spacing="1">PEOPLE</text>
    <text x="60" y="236" font-size="84" font-weight="800" fill="#2b2e7c">80%</text>
    <text x="60" y="276" font-size="19" fill="#2b2e7c">of AI users say it made them</text>
    <text x="60" y="302" font-size="19" fill="#2b2e7c">more productive</text>
    <rect x="60" y="330" width="340" height="16" rx="4" fill="#e0e7ef" />
    <rect x="60" y="330" width="272" height="16" rx="4" fill="#0ea5e9" />

    <!-- tile 2 -->
    <rect x="450" y="104" width="400" height="280" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="2" />
    <text x="480" y="150" font-size="18" font-weight="700" fill="#b45309" letter-spacing="1">ORGANISATIONS</text>
    <text x="480" y="236" font-size="84" font-weight="800" fill="#2b2e7c">37%</text>
    <text x="480" y="276" font-size="19" fill="#2b2e7c">report any effect of AI</text>
    <text x="480" y="302" font-size="19" fill="#2b2e7c">on profit (EBIT)</text>
    <rect x="480" y="330" width="340" height="16" rx="4" fill="#e0e7ef" />
    <rect x="480" y="330" width="126" height="16" rx="4" fill="#f59e0b" />

    <text x="30" y="424" font-size="19" font-weight="700" fill="#2b2e7c">The gap is the workflow: AI helps one person with one task, but the job still waits in a queue.</text>
    <text x="30" y="454" font-size="16" fill="#6b7194">Source: McKinsey, The State of AI in 2026 (August 2026), survey of 1,719 respondents.</text>
  </g>
</svg>
