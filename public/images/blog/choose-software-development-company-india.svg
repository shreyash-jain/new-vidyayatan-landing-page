<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" role="img" aria-label="Cover card reading: Playbook. How to Choose the Right Software Development Company in India. A buyer's checklist — vetting, engagement models, IP and exit terms.">
  <defs>
    <linearGradient id="cv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="48%" stop-color="#161431" />
      <stop offset="100%" stop-color="#2b2e7c" />
    </linearGradient>
    <radialGradient id="cv-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cv-haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cv-bg)" />
  <circle cx="1080" cy="140" r="300" fill="url(#cv-glow)" />
  <circle cx="120" cy="560" r="280" fill="url(#cv-haze)" />

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="80" y="150" font-size="23" font-weight="700" letter-spacing="4" fill="#fbbf24">PLAYBOOK</text>

    <g font-size="72" font-weight="700" fill="#ffffff">
      <text x="80" y="268">How to Choose the Right</text>
      <text x="80" y="356">Software Development</text>
      <text x="80" y="444">Company in India</text>
    </g>

    <rect x="80" y="498" width="120" height="6" rx="3" fill="#fbbf24" />

    <text x="80" y="558" font-size="26" fill="#9fb3d1">A buyer's checklist — vetting, engagement models, IP and exit terms.</text>
  </g>
</svg>
