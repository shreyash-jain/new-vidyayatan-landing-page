<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Six steps of predictive analytics: collect business data, clean and organise it, find patterns, apply a model, generate predictions, then decide and check the results, which feed back into the model.">
  <rect width="880" height="500" fill="#ffffff" />
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7194"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">How predictive analytics works</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">From scattered data to a prediction you can act on</text>
<rect x="30" y="110" width="266" height="150" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><circle cx="62" cy="146" r="15" fill="#fff" stroke="#2b2e7c" stroke-width="2"/><text x="62" y="152" font-size="17" font-weight="700" fill="#2b2e7c" text-anchor="middle">1</text><text x="88" y="153" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Collect</text><text x="52" y="202" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Sales, CRM, website,</text><text x="52" y="226" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">finance and more</text><path d="M298,185 H305" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/><rect x="307" y="110" width="266" height="150" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="339" cy="146" r="15" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="339" y="152" font-size="17" font-weight="700" fill="#0ea5e9" text-anchor="middle">2</text><text x="365" y="153" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Clean</text><text x="329" y="202" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Fix gaps, duplicates</text><text x="329" y="226" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">and mixed formats</text><path d="M575,185 H582" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/><rect x="584" y="110" width="266" height="150" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="616" cy="146" r="15" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="616" y="152" font-size="17" font-weight="700" fill="#0ea5e9" text-anchor="middle">3</text><text x="642" y="153" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Find patterns</text><text x="606" y="202" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Trends, seasons, what</text><text x="606" y="226" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">goes together</text><rect x="30" y="290" width="266" height="150" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="62" cy="326" r="15" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="62" y="332" font-size="17" font-weight="700" fill="#0ea5e9" text-anchor="middle">4</text><text x="88" y="333" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Apply a model</text><text x="52" y="382" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Statistics and</text><text x="52" y="406" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">machine learning</text><path d="M298,365 H305" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/><rect x="307" y="290" width="266" height="150" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><circle cx="339" cy="326" r="15" fill="#fff" stroke="#047857" stroke-width="2"/><text x="339" y="332" font-size="17" font-weight="700" fill="#047857" text-anchor="middle">5</text><text x="365" y="333" font-size="21" font-weight="700" fill="#047857" text-anchor="start">Predict</text><text x="329" y="382" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">A forecast, a score</text><text x="329" y="406" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">or an alert</text><path d="M575,365 H582" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/><rect x="584" y="290" width="266" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="616" cy="326" r="15" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="616" y="332" font-size="17" font-weight="700" fill="#f59e0b" text-anchor="middle">6</text><text x="642" y="333" font-size="21" font-weight="700" fill="#b45309" text-anchor="start">Decide and check</text><text x="606" y="382" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Act, then compare with</text><text x="606" y="406" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">what really happened</text><path d="M717,262 V276 H163 V288" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/><text x="440" y="474" font-size="17" font-weight="600" fill="#6b7194" text-anchor="middle">Step 6 feeds back: real outcomes are used to retrain the model</text>
  </g>
</svg>
