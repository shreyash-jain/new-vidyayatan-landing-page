<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Diagram: an age determination decides whether a user is a child. If so, a verifiable parental consent flow runs and writes an append-only consent record holding the purpose, the verification evidence, the notice version and any withdrawal. Every processing path checks that record at the point of use, and retention and erasure jobs run from it. A note records that tracking, profiling and targeted advertising to children are prohibited regardless of consent.">
  <rect width="880" height="500" fill="#ffffff" />

  <text x="36" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#2b2e7c">Consent as a record, not a flag</text>
  <text x="36" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#6b7194">Every processing path asks the record at the point of use, because consent can be withdrawn.</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- age gate -->
    <rect x="36" y="112" width="188" height="76" rx="14" fill="#ffffff" stroke="#1677ff" stroke-opacity="0.5" stroke-width="2" />
    <text x="130" y="142" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2e7c">Age determination</text>
    <text x="130" y="164" text-anchor="middle" font-size="13" fill="#6b7194">under 18?</text>

    <!-- consent flow -->
    <rect x="268" y="112" width="212" height="76" rx="14" fill="#ffffff" stroke="#1677ff" stroke-opacity="0.5" stroke-width="2" />
    <text x="374" y="142" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2e7c">Verifiable parental</text>
    <text x="374" y="164" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2e7c">consent</text>

    <!-- the record -->
    <rect x="524" y="104" width="320" height="196" rx="16" fill="#f8fafc" stroke="#2b2e7c" stroke-opacity="0.35" stroke-width="2.5" />
    <text x="548" y="136" font-size="12" font-weight="700" fill="#6b7194" letter-spacing="1">APPEND-ONLY CONSENT RECORD</text>
    <g font-size="15" fill="#2b2e7c">
      <text x="548" y="166">Whose data · which purpose</text>
      <text x="548" y="194">Who consented · what proved it</text>
      <text x="548" y="222">Notice version · timestamp</text>
      <text x="548" y="250">Withdrawn at</text>
    </g>
    <rect x="548" y="264" width="272" height="1" fill="#2b2e7c" fill-opacity="0.15" />
    <text x="548" y="286" font-size="14" fill="#6b7194">One row per purpose, never updated in place</text>

    <!-- downstream -->
    <rect x="36" y="340" width="212" height="76" rx="14" fill="#ffffff" stroke="#1677ff" stroke-opacity="0.5" stroke-width="2" />
    <text x="142" y="370" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2e7c">Processing paths</text>
    <text x="142" y="392" text-anchor="middle" font-size="13" fill="#6b7194">check at point of use</text>

    <rect x="292" y="340" width="212" height="76" rx="14" fill="#ffffff" stroke="#1677ff" stroke-opacity="0.5" stroke-width="2" />
    <text x="398" y="370" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2e7c">Retention clock</text>
    <text x="398" y="392" text-anchor="middle" font-size="13" fill="#6b7194">per data category</text>

    <rect x="548" y="340" width="212" height="76" rx="14" fill="#ffffff" stroke="#1677ff" stroke-opacity="0.5" stroke-width="2" />
    <text x="654" y="370" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2e7c">Erasure job</text>
    <text x="654" y="392" text-anchor="middle" font-size="13" fill="#6b7194">acts on withdrawal</text>
  </g>

  <!-- arrows -->
  <g stroke="#1677ff" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M 224 150 L 260 150" />
    <path d="M 480 150 L 516 150" />
    <path d="M 684 300 L 684 332" />
    <path d="M 640 202 L 640 316 L 398 316 L 398 332" />
    <path d="M 560 202 L 560 316 L 142 316 L 142 332" />
  </g>
  <g fill="#1677ff" fill-opacity="0.45">
    <path d="M 260 150 l -7 -4 v 8 z" />
    <path d="M 516 150 l -7 -4 v 8 z" />
    <path d="M 684 332 l -4 -8 h 8 z" />
    <path d="M 398 332 l -4 -8 h 8 z" />
    <path d="M 142 332 l -4 -8 h 8 z" />
  </g>

  <!-- prohibition note -->
  <rect x="36" y="440" width="808" height="42" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2" />
  <text x="58" y="467" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#2b2e7c"><tspan font-weight="700" fill="#b91c1c">Outside this flow entirely: </tspan>tracking, behavioural monitoring and targeted advertising to children are prohibited — consent cannot enable them.</text>
</svg>
