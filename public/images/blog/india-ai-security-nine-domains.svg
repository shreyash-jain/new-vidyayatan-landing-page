<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="The nine CERT-In AI audit domains: governance and accountability; data lifecycle and privacy; model risk management; ethics, bias and fairness; explainability and transparency; security and incident reporting; monitoring and validation; human oversight; third-party and supply chain.">
<rect width="880" height="500" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">The nine things a CERT-In audit looks at</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">Each domain is really one plain question</text><rect x="30" y="100" width="268" height="120" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><circle cx="60" cy="130" r="16" fill="#2b2e7c"/><text x="60" y="136" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="86" y="130" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">Governance and</text>
<text x="86" y="151" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">accountability</text><text x="48" y="184" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Who owns this AI</text>
<text x="48" y="203" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">when it goes wrong?</text><rect x="311" y="100" width="268" height="120" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="341" cy="130" r="16" fill="#0ea5e9"/><text x="341" y="136" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="367" y="130" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">Data lifecycle</text>
<text x="367" y="151" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">and privacy</text><text x="329" y="184" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Where does data come from,</text>
<text x="329" y="203" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">and where does it go?</text><rect x="592" y="100" width="268" height="120" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><circle cx="622" cy="130" r="16" fill="#047857"/><text x="622" y="136" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="648" y="130" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">Model risk</text>
<text x="648" y="151" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">management</text><text x="610" y="184" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">What if the model</text>
<text x="610" y="203" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">is simply wrong?</text><rect x="30" y="232" width="268" height="120" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><circle cx="60" cy="262" r="16" fill="#2b2e7c"/><text x="60" y="268" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="86" y="262" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">Ethics, bias</text>
<text x="86" y="283" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">and fairness</text><text x="48" y="316" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Does it treat</text>
<text x="48" y="335" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">people equally?</text><rect x="311" y="232" width="268" height="120" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="341" cy="262" r="16" fill="#0ea5e9"/><text x="341" y="268" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="367" y="262" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">Explainability and</text>
<text x="367" y="283" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">transparency</text><text x="329" y="316" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Can you explain</text>
<text x="329" y="335" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">a decision to a customer?</text><rect x="592" y="232" width="268" height="120" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><circle cx="622" cy="262" r="16" fill="#047857"/><text x="622" y="268" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="648" y="262" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">Security and</text>
<text x="648" y="283" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">incident reporting</text><text x="610" y="316" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Can it be attacked?</text>
<text x="610" y="335" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Would you know?</text><rect x="30" y="364" width="268" height="120" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><circle cx="60" cy="394" r="16" fill="#2b2e7c"/><text x="60" y="400" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="86" y="394" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">Monitoring and</text>
<text x="86" y="415" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">validation</text><text x="48" y="448" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Is it still working</text>
<text x="48" y="467" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">as well as on day one?</text><rect x="311" y="364" width="268" height="120" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="341" cy="394" r="16" fill="#0ea5e9"/><text x="341" y="400" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="367" y="400" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">Human oversight</text><text x="329" y="448" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Can a person step in</text>
<text x="329" y="467" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">and overrule it?</text><rect x="592" y="364" width="268" height="120" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><circle cx="622" cy="394" r="16" fill="#047857"/><text x="622" y="400" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">9</text><text x="648" y="394" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">Third-party and</text>
<text x="648" y="415" font-size="17.5" font-weight="700" fill="#2b2e7c" text-anchor="start">supply chain</text><text x="610" y="448" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Do your AI vendors</text>
<text x="610" y="467" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">meet your standard?</text>
</g>
</svg>
