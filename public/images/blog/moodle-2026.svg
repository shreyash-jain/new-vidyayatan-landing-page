<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" role="img" aria-label="Abstract graphic: a broad foundation block supporting a dense field of small modular tiles, with a single highlighted keystone tile at the centre and a slowly descending trend line across the top">
  <defs>
    <linearGradient id="md-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#161431" />
      <stop offset="100%" stop-color="#2b2e7c" />
    </linearGradient>
    <radialGradient id="md-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#md-bg)" />
  <circle cx="600" cy="380" r="300" fill="url(#md-glow)" />

  <!-- the slowly descending trend line -->
  <path d="M 120 108 L 320 122 L 520 132 L 720 152 L 920 168 L 1080 186"
        stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="3" fill="none" stroke-linecap="round" />
  <g fill="#7dd3fc" fill-opacity="0.55">
    <circle cx="120" cy="108" r="6" /><circle cx="320" cy="122" r="6" /><circle cx="520" cy="132" r="6" />
    <circle cx="720" cy="152" r="6" /><circle cx="920" cy="168" r="6" /><circle cx="1080" cy="186" r="6" />
  </g>

  <!-- dense field of modular tiles: the plugin ecosystem -->
  <g fill="#38bdf8" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.5">
    <rect x="200" y="240" width="58" height="40" rx="7" /><rect x="268" y="240" width="58" height="40" rx="7" />
    <rect x="336" y="240" width="58" height="40" rx="7" /><rect x="404" y="240" width="58" height="40" rx="7" />
    <rect x="472" y="240" width="58" height="40" rx="7" /><rect x="608" y="240" width="58" height="40" rx="7" />
    <rect x="676" y="240" width="58" height="40" rx="7" /><rect x="744" y="240" width="58" height="40" rx="7" />
    <rect x="812" y="240" width="58" height="40" rx="7" /><rect x="880" y="240" width="58" height="40" rx="7" />

    <rect x="200" y="290" width="58" height="40" rx="7" /><rect x="268" y="290" width="58" height="40" rx="7" />
    <rect x="336" y="290" width="58" height="40" rx="7" /><rect x="404" y="290" width="58" height="40" rx="7" />
    <rect x="472" y="290" width="58" height="40" rx="7" /><rect x="608" y="290" width="58" height="40" rx="7" />
    <rect x="676" y="290" width="58" height="40" rx="7" /><rect x="744" y="290" width="58" height="40" rx="7" />
    <rect x="812" y="290" width="58" height="40" rx="7" /><rect x="880" y="290" width="58" height="40" rx="7" />

    <rect x="200" y="340" width="58" height="40" rx="7" /><rect x="268" y="340" width="58" height="40" rx="7" />
    <rect x="336" y="340" width="58" height="40" rx="7" /><rect x="404" y="340" width="58" height="40" rx="7" />
    <rect x="472" y="340" width="58" height="40" rx="7" /><rect x="540" y="340" width="58" height="40" rx="7" />
    <rect x="608" y="340" width="58" height="40" rx="7" /><rect x="676" y="340" width="58" height="40" rx="7" />
    <rect x="744" y="340" width="58" height="40" rx="7" /><rect x="812" y="340" width="58" height="40" rx="7" />
    <rect x="880" y="340" width="58" height="40" rx="7" />

    <rect x="200" y="390" width="58" height="40" rx="7" /><rect x="268" y="390" width="58" height="40" rx="7" />
    <rect x="336" y="390" width="58" height="40" rx="7" /><rect x="404" y="390" width="58" height="40" rx="7" />
    <rect x="472" y="390" width="58" height="40" rx="7" /><rect x="540" y="390" width="58" height="40" rx="7" />
    <rect x="608" y="390" width="58" height="40" rx="7" /><rect x="676" y="390" width="58" height="40" rx="7" />
    <rect x="744" y="390" width="58" height="40" rx="7" /><rect x="812" y="390" width="58" height="40" rx="7" />
    <rect x="880" y="390" width="58" height="40" rx="7" />
  </g>

  <!-- the keystone: the operator -->
  <rect x="540" y="240" width="58" height="90" rx="9" fill="#fbbf24" fill-opacity="0.9" />

  <!-- the foundation you own -->
  <rect x="180" y="460" width="778" height="56" rx="14" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.55" stroke-width="3" />
  <g fill="#34d399" fill-opacity="0.55">
    <rect x="214" y="482" width="120" height="12" rx="6" />
    <rect x="352" y="482" width="120" height="12" rx="6" />
    <rect x="490" y="482" width="120" height="12" rx="6" />
    <rect x="628" y="482" width="120" height="12" rx="6" />
    <rect x="766" y="482" width="120" height="12" rx="6" />
  </g>
</svg>
