<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Four levels of AI agent autonomy: look, suggest, act with approval, and act alone. Most projects stay on the middle levels for months, and the last level is only for low-risk, reversible tasks.">
  <rect width="880" height="470" fill="#ffffff" />
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7194"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">The trust ladder</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">Start at level 1. Move up only when the numbers hold</text>
<rect x="30" y="100" width="820" height="76" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><circle cx="72" cy="138" r="22" fill="#2b2e7c"/><text x="72" y="146" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="112" y="132" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Look</text><text x="112" y="158" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Reads the data and reports. Nothing changes.</text><text x="838" y="132" font-size="14" font-weight="700" fill="#6b7194" text-anchor="end">e.g.</text><text x="838" y="158" font-size="15" font-weight="400" fill="#6b7194" text-anchor="end">Weekly report of late invoices</text>
<rect x="30" y="188" width="820" height="76" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="72" cy="226" r="22" fill="#0ea5e9"/><text x="72" y="234" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="112" y="220" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Suggest</text><text x="112" y="246" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Drafts the work. A person sends it.</text><text x="838" y="220" font-size="14" font-weight="700" fill="#6b7194" text-anchor="end">e.g.</text><text x="838" y="246" font-size="15" font-weight="400" fill="#6b7194" text-anchor="end">Draft reply to a customer</text>
<rect x="30" y="276" width="820" height="76" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><circle cx="72" cy="314" r="22" fill="#047857"/><text x="72" y="322" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="112" y="308" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Act with approval</text><text x="112" y="334" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Does the task once a person clicks approve.</text><text x="838" y="308" font-size="14" font-weight="700" fill="#6b7194" text-anchor="end">e.g.</text><text x="838" y="334" font-size="15" font-weight="400" fill="#6b7194" text-anchor="end">Sends a new payment link</text>
<rect x="30" y="364" width="820" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="72" cy="402" r="22" fill="#f59e0b"/><text x="72" y="410" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="112" y="396" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Act alone</text><text x="112" y="422" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Only for low-risk, reversible tasks. Logged, with an off switch.</text><text x="838" y="396" font-size="14" font-weight="700" fill="#6b7194" text-anchor="end">e.g.</text><text x="838" y="422" font-size="15" font-weight="400" fill="#6b7194" text-anchor="end">Tagging support tickets</text>

  </g>
</svg>
