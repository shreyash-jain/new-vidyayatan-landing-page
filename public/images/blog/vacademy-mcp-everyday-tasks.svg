<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="Everyday tasks by team: owners ask for a summary of enquiries, leads and results; admissions teams ask who to call back and for call and follow-up status; educators ask about course and learner progress; operations teams ask for reports and website drafts.">
  <rect width="880" height="410" fill="#ffffff" />
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7194"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">What each team can ask for</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">Same connection, different jobs</text>
<rect x="30" y="108" width="190" height="200" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><text x="125" y="148" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="middle">Owners</text><line x1="50" y1="164" x2="200" y2="164" stroke="#2b2e7c" stroke-width="2"/><text x="48" y="202" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">New enquiries this</text><text x="48" y="226" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">week? Where do</text><text x="48" y="250" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">leads get stuck?</text><rect x="240" y="108" width="190" height="200" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="335" y="148" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="middle">Admissions</text><line x1="260" y1="164" x2="410" y2="164" stroke="#0ea5e9" stroke-width="2"/><text x="258" y="202" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Who needs a</text><text x="258" y="226" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">follow-up? What was</text><text x="258" y="250" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">said on the last call?</text><rect x="450" y="108" width="190" height="200" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="545" y="148" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="middle">Educators</text><line x1="470" y1="164" x2="620" y2="164" stroke="#047857" stroke-width="2"/><text x="468" y="202" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">How is each learner</text><text x="468" y="226" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">progressing in</text><text x="468" y="250" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">this course?</text><rect x="660" y="108" width="190" height="200" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="755" y="148" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="middle">Operations</text><line x1="680" y1="164" x2="830" y2="164" stroke="#f59e0b" stroke-width="2"/><text x="678" y="202" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Pull this month's</text><text x="678" y="226" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">report. Draft a</text><text x="678" y="250" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">website page.</text><rect x="30" y="328" width="820" height="52" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="440" y="361" font-size="19" font-weight="600" fill="#b45309" text-anchor="middle">You ask in plain words. Edits are saved as drafts for a person to review.</text>
  </g>
</svg>
