<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" role="img" aria-label="Abstract graphic: a column of data fields passes through a gate, where several are held back and a smaller set continues into a protected store">
  <defs>
    <linearGradient id="dp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#161431" />
      <stop offset="100%" stop-color="#2b2e7c" />
    </linearGradient>
    <radialGradient id="dp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dp-bg)" />
  <circle cx="820" cy="315" r="300" fill="url(#dp-glow)" />

  <!-- incoming fields, left: many -->
  <g>
    <rect x="110" y="120" width="200" height="34" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#7dd3fc" stroke-opacity="0.40" stroke-width="2" />
    <rect x="110" y="170" width="200" height="34" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#7dd3fc" stroke-opacity="0.40" stroke-width="2" />
    <rect x="110" y="220" width="200" height="34" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#7dd3fc" stroke-opacity="0.40" stroke-width="2" />
    <rect x="110" y="270" width="200" height="34" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#7dd3fc" stroke-opacity="0.40" stroke-width="2" />
    <rect x="110" y="320" width="200" height="34" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#7dd3fc" stroke-opacity="0.40" stroke-width="2" />
    <rect x="110" y="370" width="200" height="34" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#7dd3fc" stroke-opacity="0.40" stroke-width="2" />
    <rect x="110" y="420" width="200" height="34" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#7dd3fc" stroke-opacity="0.40" stroke-width="2" />
    <rect x="110" y="470" width="200" height="34" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#7dd3fc" stroke-opacity="0.40" stroke-width="2" />
  </g>

  <!-- the gate -->
  <rect x="470" y="96" width="18" height="438" rx="9" fill="#fbbf24" fill-opacity="0.85" />
  <rect x="470" y="212" width="18" height="60" rx="9" fill="#0a0f1d" />
  <rect x="470" y="330" width="18" height="60" rx="9" fill="#0a0f1d" />

  <!-- held back: crossed paths -->
  <g stroke="#f87171" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round">
    <path d="M 330 137 L 452 137" stroke-dasharray="8 9" />
    <path d="M 330 187 L 452 187" stroke-dasharray="8 9" />
    <path d="M 330 287 L 452 287" stroke-dasharray="8 9" />
    <path d="M 330 387 L 452 387" stroke-dasharray="8 9" />
    <path d="M 330 487 L 452 487" stroke-dasharray="8 9" />
    <path d="M 400 128 l 18 18 M 418 128 l -18 18" />
    <path d="M 400 178 l 18 18 M 418 178 l -18 18" />
    <path d="M 400 278 l 18 18 M 418 278 l -18 18" />
    <path d="M 400 378 l 18 18 M 418 378 l -18 18" />
    <path d="M 400 478 l 18 18 M 418 478 l -18 18" />
  </g>

  <!-- passing through -->
  <g stroke="#34d399" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 330 237 L 640 237" />
    <path d="M 330 337 L 640 337" />
    <path d="M 330 437 L 640 287" />
  </g>

  <!-- protected store -->
  <rect x="700" y="196" width="330" height="200" rx="22" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.55" stroke-width="3" />
  <rect x="740" y="240" width="250" height="30" rx="8" fill="#34d399" fill-opacity="0.30" />
  <rect x="740" y="286" width="250" height="30" rx="8" fill="#34d399" fill-opacity="0.30" />
  <rect x="740" y="332" width="180" height="30" rx="8" fill="#34d399" fill-opacity="0.30" />

  <!-- lock glyph -->
  <g transform="translate(840, 128)">
    <rect x="-30" y="8" width="60" height="46" rx="10" fill="#34d399" fill-opacity="0.85" />
    <path d="M -16 8 v -14 a 16 16 0 0 1 32 0 v 14" fill="none" stroke="#34d399" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
