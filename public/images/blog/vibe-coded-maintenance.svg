<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#14532d" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-grad-m)" />
  
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Glowing background elements -->
  <circle cx="600" cy="280" r="240" fill="url(#purple-glow)" />

  <!-- Shield and Maintenance Gear visual -->
  <g transform="translate(600, 260)">
    <!-- Central Shield -->
    <path d="M-140 -120 L140 -120 L140 20 Q140 160 0 220 Q-140 160 -140 20 Z" fill="#0f172a" fill-opacity="0.9" stroke="url(#green-grad)" stroke-width="4" />
    
    <!-- Code Health Metrics Cards inside shield -->
    <g transform="translate(-100, -80)">
      <rect width="200" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="15" y="26" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">✓ Type Safety (Zod + TS)</text>
    </g>

    <g transform="translate(-100, -25)">
      <rect width="200" height="42" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="15" y="26" fill="#67e8f9" font-family="sans-serif" font-size="13" font-weight="700">✓ Playwright E2E Suite</text>
    </g>

    <g transform="translate(-100, 30)">
      <rect width="200" height="42" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="15" y="26" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">✓ Automated CI/CD Pipeline</text>
    </g>

    <g transform="translate(-100, 85)">
      <rect width="200" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="15" y="26" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="700">✓ Zero Hallucinated NPMs</text>
    </g>
  </g>

  <!-- Left Side Badges -->
  <g transform="translate(100, 200)">
    <rect width="280" height="90" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="38" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">TECHNICAL DEBT CLEANUP</text>
    <text x="25" y="65" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Refactoring Spaghetti AI Code</text>
  </g>

  <g transform="translate(100, 320)">
    <rect width="280" height="90" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="38" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">DEPENDENCY AUDITING</text>
    <text x="25" y="65" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Patching Vulnerabilities</text>
  </g>

  <!-- Right Side Badges -->
  <g transform="translate(820, 200)">
    <rect width="280" height="90" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="38" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">RETAINER SUPPORT</text>
    <text x="25" y="65" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Ongoing Engineering</text>
  </g>

  <g transform="translate(820, 320)">
    <rect width="280" height="90" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="38" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">MONITORING & LOGS</text>
    <text x="25" y="65" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">24/7 Sentry Error Alerts</text>
  </g>

  <text x="600" y="580" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="600">Vidyayatan Engineering • How to Maintain Your Vibe Coded App</text>
</svg>
