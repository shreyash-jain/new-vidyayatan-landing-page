<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-label="Five industries and what predictive analytics estimates in each: fintech fraud and repayment risk, agritech crop performance, edtech students falling behind, manufacturing machine failure, healthtech patient risk and resource needs.">
  <rect width="880" height="480" fill="#ffffff" />
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7194"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">Predictive analytics across industries</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">The same method, a different question in each sector</text>
<rect x="30" y="104" width="200" height="60" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><text x="130" y="142" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="middle">Fintech</text><path d="M232,134 H252" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/><rect x="255" y="104" width="595" height="60" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="273" y="141" font-size="17" font-weight="400" fill="#2b2e7c" text-anchor="start">Which transactions look like fraud; who may miss a repayment</text><rect x="30" y="176" width="200" height="60" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><text x="130" y="214" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="middle">Agritech</text><path d="M232,206 H252" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/><rect x="255" y="176" width="595" height="60" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="273" y="213" font-size="17" font-weight="400" fill="#2b2e7c" text-anchor="start">Likely crop performance, and when to plan inputs and labour</text><rect x="30" y="248" width="200" height="60" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><text x="130" y="286" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="middle">EdTech</text><path d="M232,278 H252" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/><rect x="255" y="248" width="595" height="60" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="273" y="285" font-size="17" font-weight="400" fill="#2b2e7c" text-anchor="start">Which students may fall behind and which courses lose them</text><rect x="30" y="320" width="200" height="60" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><text x="130" y="358" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="middle">Manufacturing</text><path d="M232,350 H252" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/><rect x="255" y="320" width="595" height="60" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="273" y="357" font-size="17" font-weight="400" fill="#2b2e7c" text-anchor="start">When a machine is likely to fail, and how much to produce</text><rect x="30" y="392" width="200" height="60" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><text x="130" y="430" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="middle">HealthTech</text><path d="M232,422 H252" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/><rect x="255" y="392" width="595" height="60" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="273" y="429" font-size="17" font-weight="400" fill="#2b2e7c" text-anchor="start">Higher-risk patients and the beds and staff next week needs</text>
  </g>
</svg>
