<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 734" width="880" height="734" role="img" aria-label="Diagram: six pillars worth 100 marks each are scored twice, once by an expert panel and once by the school itself, each on a five-point scale; the two are averaged into a grade band running from Foundational to Excellence">
