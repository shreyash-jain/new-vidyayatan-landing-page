<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Diagram of the load-tested journey: log in, open the paper, start the attempt, then a repeating autosave loop, then submit. Two failures are marked — an inline analytics handoff on the submit path that serialised the request pool, and a background recalculation racing the submit and overwriting it. A separate note records that the load generator saw only successful responses.">
  <rect width="880" height="470" fill="#ffffff" />

  <text x="36" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#2b2e7c">The journey we tested</text>
  <text x="36" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#6b7194">Both failures sat between autosave and submit — where no endpoint benchmark looks.</text>

  <!-- five steps -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="36" y="118" width="140" height="66" rx="14" fill="#ffffff" stroke="#1677ff" stroke-opacity="0.5" stroke-width="2" />
    <text x="106" y="149" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2e7c">Log in</text>
    <text x="106" y="169" text-anchor="middle" font-size="13" fill="#6b7194">p95 146 ms</text>

    <rect x="204" y="118" width="140" height="66" rx="14" fill="#ffffff" stroke="#1677ff" stroke-opacity="0.5" stroke-width="2" />
    <text x="274" y="149" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2e7c">Open paper</text>
    <text x="274" y="169" text-anchor="middle" font-size="13" fill="#6b7194">p95 465 ms</text>

    <rect x="372" y="118" width="140" height="66" rx="14" fill="#ffffff" stroke="#1677ff" stroke-opacity="0.5" stroke-width="2" />
    <text x="442" y="149" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2e7c">Start attempt</text>
    <text x="442" y="169" text-anchor="middle" font-size="13" fill="#6b7194">p95 134 ms</text>

    <rect x="540" y="118" width="140" height="66" rx="14" fill="#ffffff" stroke="#1677ff" stroke-opacity="0.5" stroke-width="2" />
    <text x="610" y="149" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2e7c">Autosave ×N</text>
    <text x="610" y="169" text-anchor="middle" font-size="13" fill="#6b7194">p95 140 ms</text>

    <rect x="708" y="118" width="140" height="66" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="2.5" />
    <text x="778" y="149" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2e7c">Submit</text>
    <text x="778" y="169" text-anchor="middle" font-size="13" fill="#6b7194">p95 139 ms</text>
  </g>

  <!-- connectors -->
  <g stroke="#1677ff" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M 176 151 L 200 151" /><path d="M 344 151 L 368 151" />
    <path d="M 512 151 L 536 151" /><path d="M 680 151 L 704 151" />
  </g>
  <g fill="#1677ff" fill-opacity="0.45">
    <path d="M 200 151 l -7 -4 v 8 z" /><path d="M 368 151 l -7 -4 v 8 z" />
    <path d="M 536 151 l -7 -4 v 8 z" /><path d="M 704 151 l -7 -4 v 8 z" />
  </g>

  <!-- autosave loop arrow -->
  <path d="M 574 118 q 36 -34 72 0" stroke="#1677ff" stroke-opacity="0.45" stroke-width="2" fill="none" />
  <path d="M 646 118 l -8 -3 l 2 8 z" fill="#1677ff" fill-opacity="0.45" />

  <!-- failure one -->
  <rect x="600" y="232" width="248" height="86" rx="14" fill="#fef2f2" stroke="#f87171" stroke-width="2" />
  <text x="618" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" letter-spacing="1">FAILURE 1</text>
  <text x="618" y="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2b2e7c">Analytics handoff ran inline,</text>
  <text x="618" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2b2e7c">not in the background.</text>
  <path d="M 778 190 L 778 228" stroke="#f87171" stroke-width="2" fill="none" />
  <path d="M 778 228 l -4 -8 h 8 z" fill="#f87171" />

  <!-- failure two -->
  <rect x="292" y="232" width="276" height="86" rx="14" fill="#fef2f2" stroke="#f87171" stroke-width="2" />
  <text x="310" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" letter-spacing="1">FAILURE 2</text>
  <text x="310" y="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2b2e7c">Background recalculation raced</text>
  <text x="310" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#2b2e7c">the submit and overwrote it.</text>
  <path d="M 610 190 L 610 214 L 470 214 L 470 228" stroke="#f87171" stroke-width="2" fill="none" />
  <path d="M 470 228 l -4 -8 h 8 z" fill="#f87171" />

  <!-- the invisibility note -->
  <rect x="36" y="356" width="812" height="82" rx="14" fill="#f8fafc" stroke="#2b2e7c" stroke-opacity="0.18" stroke-width="2" />
  <text x="58" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6b7194" letter-spacing="1">WHAT THE LOAD GENERATOR REPORTED</text>
  <text x="58" y="410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#2b2e7c">1,000 requests · 1,000 successes · 0 errors — while 66 of those attempts were never actually stored as</text>
  <text x="58" y="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#2b2e7c">submitted. Only a direct database query found it.</text>
</svg>
