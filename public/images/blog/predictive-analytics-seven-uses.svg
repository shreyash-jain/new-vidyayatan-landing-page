<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="Seven areas where predictive analytics helps: sales, customers, marketing, inventory, risk, operations and strategy, each with what it predicts.">
  <rect width="880" height="410" fill="#ffffff" />
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7194"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">Seven places predictive analytics pays off</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">What each area can estimate before it happens</text>
<rect x="30" y="108" width="190" height="130" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="60" cy="140" r="15" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="60" y="146" font-size="17" font-weight="700" fill="#0ea5e9" text-anchor="middle">1</text><text x="84" y="147" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Sales</text><text x="50" y="188" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Next quarter's</text><text x="50" y="211" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">revenue and demand</text><rect x="240" y="108" width="190" height="130" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="270" cy="140" r="15" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="270" y="146" font-size="17" font-weight="700" fill="#0ea5e9" text-anchor="middle">2</text><text x="294" y="147" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Customers</text><text x="260" y="188" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Who is likely</text><text x="260" y="211" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">to leave or reorder</text><rect x="450" y="108" width="190" height="130" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="480" cy="140" r="15" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="480" y="146" font-size="17" font-weight="700" fill="#0ea5e9" text-anchor="middle">3</text><text x="504" y="147" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Marketing</text><text x="470" y="188" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Which leads and</text><text x="470" y="211" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">campaigns will pay</text><rect x="660" y="108" width="190" height="130" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="690" cy="140" r="15" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="690" y="146" font-size="17" font-weight="700" fill="#0ea5e9" text-anchor="middle">4</text><text x="714" y="147" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Inventory</text><text x="680" y="188" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">What to stock,</text><text x="680" y="211" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">and when to order</text><rect x="135" y="258" width="190" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="165" cy="290" r="15" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="165" y="296" font-size="17" font-weight="700" fill="#f59e0b" text-anchor="middle">5</text><text x="189" y="297" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Risk</text><text x="155" y="338" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Fraud, defaults and</text><text x="155" y="361" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">early warning signs</text><rect x="345" y="258" width="190" height="130" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="375" cy="290" r="15" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="375" y="296" font-size="17" font-weight="700" fill="#0ea5e9" text-anchor="middle">6</text><text x="399" y="297" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Operations</text><text x="365" y="338" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Staff and capacity,</text><text x="365" y="361" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">and bottlenecks</text><rect x="555" y="258" width="190" height="130" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><circle cx="585" cy="290" r="15" fill="#fff" stroke="#047857" stroke-width="2"/><text x="585" y="296" font-size="17" font-weight="700" fill="#047857" text-anchor="middle">7</text><text x="609" y="297" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Strategy</text><text x="575" y="338" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Which growth bets</text><text x="575" y="361" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">look most likely</text>
  </g>
</svg>
