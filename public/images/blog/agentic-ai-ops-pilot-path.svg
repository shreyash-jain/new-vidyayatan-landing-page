<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="A pilot path in four stages: pick one process, run the agent in shadow mode, have a person approve each action, then widen to the next process once the numbers hold. Accuracy, cost per task and time saved are tracked at every stage.">
  <rect width="880" height="420" fill="#ffffff" />
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7194"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">A pilot path in four stages</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">Measure at every stage before you widen</text>
<rect x="30" y="110" width="190" height="190" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><circle cx="68" cy="148" r="20" fill="#2b2e7c"/><text x="68" y="156" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="98" y="156" font-size="22" font-weight="700" fill="#2b2e7c" text-anchor="start">Pick</text><text x="48" y="208" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">One process with</text><text x="48" y="234" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">a clear finish</text><text x="48" y="260" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">line</text>
<path d="M222,205 H237" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="240" y="110" width="190" height="190" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="278" cy="148" r="20" fill="#0ea5e9"/><text x="278" y="156" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="308" y="156" font-size="22" font-weight="700" fill="#2b2e7c" text-anchor="start">Shadow</text><text x="258" y="208" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">The agent drafts,</text><text x="258" y="234" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">people still do</text><text x="258" y="260" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">the work</text>
<path d="M432,205 H447" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="450" y="110" width="190" height="190" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="488" cy="148" r="20" fill="#0ea5e9"/><text x="488" y="156" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="518" y="156" font-size="22" font-weight="700" fill="#2b2e7c" text-anchor="start">Approve</text><text x="468" y="208" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">The agent acts,</text><text x="468" y="234" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">a person approves</text><text x="468" y="260" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">every action</text>
<path d="M642,205 H657" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="660" y="110" width="190" height="190" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><circle cx="698" cy="148" r="20" fill="#047857"/><text x="698" y="156" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="728" y="156" font-size="22" font-weight="700" fill="#2b2e7c" text-anchor="start">Widen</text><text x="678" y="208" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Numbers hold?</text><text x="678" y="234" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Add the next</text><text x="678" y="260" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">process</text>
<rect x="30" y="330" width="820" height="60" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="440" y="367" font-size="19" font-weight="600" fill="#b45309" text-anchor="middle">Track at every stage: accuracy · cost per task · time saved</text>
  </g>
</svg>
