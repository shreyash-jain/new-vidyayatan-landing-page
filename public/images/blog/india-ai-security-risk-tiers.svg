<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" role="img" aria-label="CERT-In's four AI risk tiers. Low: basic internal checks. Moderate: independent audit. High: independent audits and closer monitoring. Critical: independent audits and continuous monitoring. The riskier the system, the deeper the audit.">
<rect width="880" height="510" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">CERT-In's four risk tiers</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">The riskier the system, the deeper the audit</text><text x="112" y="108" font-size="13" font-weight="700" fill="#6b7194" text-anchor="start">TIER</text><text x="300" y="108" font-size="13" font-weight="700" fill="#6b7194" text-anchor="start">OUR EXAMPLE</text><text x="588" y="108" font-size="13" font-weight="700" fill="#6b7194" text-anchor="start">WHAT TO EXPECT</text><rect x="30" y="120" width="820" height="76" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><circle cx="72" cy="158" r="22" fill="#047857"/><text x="72" y="166" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="112" y="165" font-size="22" font-weight="700" fill="#2b2e7c" text-anchor="start">Low</text><text x="300" y="165" font-size="16" font-weight="400" fill="#2b2e7c" text-anchor="start">Meeting-notes summariser</text><text x="588" y="165" font-size="16" font-weight="700" fill="#2b2e7c" text-anchor="start">Basic internal checks</text><rect x="30" y="208" width="820" height="76" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="72" cy="246" r="22" fill="#0ea5e9"/><text x="72" y="254" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="112" y="253" font-size="22" font-weight="700" fill="#2b2e7c" text-anchor="start">Moderate</text><text x="300" y="253" font-size="16" font-weight="400" fill="#2b2e7c" text-anchor="start">Chatbot answering customer FAQs</text><text x="588" y="253" font-size="16" font-weight="700" fill="#2b2e7c" text-anchor="start">Independent audit</text><rect x="30" y="296" width="820" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="72" cy="334" r="22" fill="#f59e0b"/><text x="72" y="342" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="112" y="341" font-size="22" font-weight="700" fill="#2b2e7c" text-anchor="start">High</text><text x="300" y="332" font-size="16" font-weight="400" fill="#2b2e7c" text-anchor="start">Recommends loans or shortlists</text><text x="300" y="352" font-size="16" font-weight="400" fill="#2b2e7c" text-anchor="start">hires</text><text x="588" y="332" font-size="16" font-weight="700" fill="#2b2e7c" text-anchor="start">Independent audits, closer</text>
<text x="588" y="352" font-size="16" font-weight="700" fill="#2b2e7c" text-anchor="start">monitoring</text><rect x="30" y="384" width="820" height="76" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><circle cx="72" cy="422" r="22" fill="#dc2626"/><text x="72" y="430" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="112" y="429" font-size="22" font-weight="700" fill="#2b2e7c" text-anchor="start">Critical</text><text x="300" y="420" font-size="16" font-weight="400" fill="#2b2e7c" text-anchor="start">Agent that moves money or</text><text x="300" y="440" font-size="16" font-weight="400" fill="#2b2e7c" text-anchor="start">touches patient care</text><text x="588" y="420" font-size="16" font-weight="700" fill="#2b2e7c" text-anchor="start">Independent audits and</text>
<text x="588" y="440" font-size="16" font-weight="700" fill="#2b2e7c" text-anchor="start">continuous monitoring</text><text x="30" y="490" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Tier depends on impact, data sensitivity, autonomy and how reversible a mistake is. Examples are ours, not CERT-In's.</text>
</g>
</svg>
