<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="The same customer message handled two ways. A chatbot replies with the shipping policy and stops. An AI agent looks up the order, sees the payment failed, sends a new payment link and updates the CRM, and hands the thread to a person if the customer replies angrily.">
  <rect width="880" height="450" fill="#ffffff" />
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7194"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">The same message, two outcomes</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">A customer writes in: where is my order?</text>
<rect x="30" y="120" width="150" height="290" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/>
<text x="105" y="230" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="middle">Customer</text><text x="105" y="262" font-size="17" font-weight="400" fill="#6b7194" text-anchor="middle">“Where is</text><text x="105" y="284" font-size="17" font-weight="400" fill="#6b7194" text-anchor="middle">my order?”</text>
<text x="210" y="138" font-size="19" font-weight="700" fill="#6b7194" text-anchor="start">Chatbot</text>
<rect x="210" y="148" width="210" height="70" rx="12" fill="#f4f5fb" stroke="#6b7194" stroke-width="2"/><text x="315" y="178" font-size="17" font-weight="400" fill="#6b7194" text-anchor="middle">Sends the shipping</text><text x="315" y="200" font-size="17" font-weight="400" fill="#6b7194" text-anchor="middle">policy</text>
<path d="M422,183 H452" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="455" y="148" width="200" height="70" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="555" y="178" font-size="19" font-weight="700" fill="#b45309" text-anchor="middle">Stops here</text><text x="555" y="200" font-size="16" font-weight="400" fill="#6b7194" text-anchor="middle">Problem still there</text>
<text x="210" y="262" font-size="19" font-weight="700" fill="#047857" text-anchor="start">AI agent</text>
<rect x="210" y="272" width="145" height="86" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="282" y="308" font-size="18" font-weight="700" fill="#2b2e7c" text-anchor="middle">Looks up</text><text x="282" y="332" font-size="17" font-weight="400" fill="#6b7194" text-anchor="middle">the order</text>
<path d="M357,315 H374" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="377" y="272" width="145" height="86" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="449" y="308" font-size="18" font-weight="700" fill="#2b2e7c" text-anchor="middle">Sees the</text><text x="449" y="332" font-size="17" font-weight="400" fill="#6b7194" text-anchor="middle">payment failed</text>
<path d="M524,315 H541" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="544" y="272" width="145" height="86" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="616" y="308" font-size="18" font-weight="700" fill="#2b2e7c" text-anchor="middle">Sends a new</text><text x="616" y="332" font-size="17" font-weight="400" fill="#6b7194" text-anchor="middle">payment link</text>
<path d="M691,315 H708" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="711" y="272" width="145" height="86" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="783" y="308" font-size="18" font-weight="700" fill="#2b2e7c" text-anchor="middle">Updates</text><text x="783" y="332" font-size="17" font-weight="400" fill="#6b7194" text-anchor="middle">the CRM</text>
<rect x="210" y="378" width="646" height="50" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="533" y="409" font-size="17" font-weight="600" fill="#b45309" text-anchor="middle">If the customer replies angrily, a person gets the whole thread</text>
  </g>
</svg>
