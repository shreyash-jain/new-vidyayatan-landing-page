<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" role="img" aria-label="A six-step roadmap: set the goal, gather the data, choose the tools, build and test models, connect them to existing systems, then watch accuracy and improve.">
  <rect width="880" height="510" fill="#ffffff" />
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7194"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">Your predictive analytics roadmap</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">Six steps from first question to a model that keeps earning its place</text>
<rect x="30" y="104" width="820" height="56" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><circle cx="62" cy="132" r="15" fill="#fff" stroke="#2b2e7c" stroke-width="2"/><text x="62" y="138" font-size="17" font-weight="700" fill="#2b2e7c" text-anchor="middle">1</text><text x="94" y="139" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Set the goal</text><text x="310" y="139" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Pick one thing to predict: churn, demand, revenue or risk</text><rect x="30" y="170" width="820" height="56" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="62" cy="198" r="15" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="62" y="204" font-size="17" font-weight="700" fill="#0ea5e9" text-anchor="middle">2</text><text x="94" y="205" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Gather the data</text><text x="310" y="205" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">CRM, ERP, website, app and internal databases</text><rect x="30" y="236" width="820" height="56" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><circle cx="62" cy="264" r="15" fill="#fff" stroke="#2b2e7c" stroke-width="2"/><text x="62" y="270" font-size="17" font-weight="700" fill="#2b2e7c" text-anchor="middle">3</text><text x="94" y="271" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Choose the tools</text><text x="310" y="271" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Fit your systems, growth plans and reporting needs</text><rect x="30" y="302" width="820" height="56" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="62" cy="330" r="15" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="62" y="336" font-size="17" font-weight="700" fill="#0ea5e9" text-anchor="middle">4</text><text x="94" y="337" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Build and test</text><text x="310" y="337" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Train models, then test them on data they haven't seen</text><rect x="30" y="368" width="820" height="56" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><circle cx="62" cy="396" r="15" fill="#fff" stroke="#2b2e7c" stroke-width="2"/><text x="62" y="402" font-size="17" font-weight="700" fill="#2b2e7c" text-anchor="middle">5</text><text x="94" y="403" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Connect it</text><text x="310" y="403" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Feed predictions into dashboards and daily workflows</text><rect x="30" y="434" width="820" height="56" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><circle cx="62" cy="462" r="15" fill="#fff" stroke="#047857" stroke-width="2"/><text x="62" y="468" font-size="17" font-weight="700" fill="#047857" text-anchor="middle">6</text><text x="94" y="469" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Watch and improve</text><text x="310" y="469" font-size="17" font-weight="400" fill="#6b7194" text-anchor="start">Track accuracy and results, and retrain as things change</text>
  </g>
</svg>
