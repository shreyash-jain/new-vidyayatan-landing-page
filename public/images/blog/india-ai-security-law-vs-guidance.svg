<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" role="img" aria-label="India's AI rulebook split in two. Binding law: the DPDP Act 2023, the IT Act 2000 and the CERT-In 2022 directions. Guidance and standards: MeitY AI Governance Guidelines from November 2025, CERT-In AI audit guidelines from November 2026, and ISO/IEC 42001 and NIST AI RMF.">
<rect width="880" height="490" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">India's AI rulebook: law vs guidance</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">Know which is which before you promise anything to a customer</text><rect x="30" y="100" width="400" height="330" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="50" y="134" font-size="22" font-weight="700" fill="#047857" text-anchor="start">Binding law</text><text x="50" y="158" font-size="15" font-weight="400" fill="#6b7194" text-anchor="start">You must comply</text><rect x="46" y="176" width="368" height="74" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><text x="60" y="202" font-size="18" font-weight="700" fill="#2b2e7c" text-anchor="start">DPDP Act, 2023</text><text x="60" y="224" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Personal data. Core duties start 13 May 2027</text><rect x="46" y="260" width="368" height="74" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><text x="60" y="286" font-size="18" font-weight="700" fill="#2b2e7c" text-anchor="start">IT Act, 2000</text><text x="60" y="308" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Base law for cyber offences and CERT-In's powers</text><rect x="46" y="344" width="368" height="74" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><text x="60" y="370" font-size="18" font-weight="700" fill="#2b2e7c" text-anchor="start">CERT-In directions, 2022</text><text x="60" y="392" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Report incidents in 6 hours. Keep logs 180 days</text><rect x="450" y="100" width="400" height="330" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="470" y="134" font-size="22" font-weight="700" fill="#0ea5e9" text-anchor="start">Guidance and standards</text><text x="470" y="158" font-size="15" font-weight="400" fill="#6b7194" text-anchor="start">You are expected to follow, not forced</text><rect x="466" y="176" width="368" height="74" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/><text x="480" y="202" font-size="18" font-weight="700" fill="#2b2e7c" text-anchor="start">MeitY AI Governance Guidelines</text><text x="480" y="224" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Nov 2025. Voluntary. Seven principles</text><rect x="466" y="260" width="368" height="74" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/><text x="480" y="286" font-size="18" font-weight="700" fill="#2b2e7c" text-anchor="start">CERT-In AI audit guidelines</text><text x="480" y="308" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Nov 2026. New. Legal force not clearly stated</text><rect x="466" y="344" width="368" height="74" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/><text x="480" y="370" font-size="18" font-weight="700" fill="#2b2e7c" text-anchor="start">ISO/IEC 42001 and NIST AI RMF</text><text x="480" y="392" font-size="14.5" font-weight="400" fill="#6b7194" text-anchor="start">Voluntary international standards</text><text x="440" y="466" font-size="16" font-weight="400" fill="#6b7194" text-anchor="middle">Guidance is not law. Customers, auditors and insurers will still ask for it.</text>
</g>
</svg>
