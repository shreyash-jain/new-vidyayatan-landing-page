<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" role="img" aria-label="Abstract graphic: a stack of stored records passes through an export gate — most emerge intact on the far side, while several are lost at the boundary">
  <defs>
    <linearGradient id="de-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#161431" />
      <stop offset="100%" stop-color="#2b2e7c" />
    </linearGradient>
    <radialGradient id="de-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#de-bg)" />
  <circle cx="880" cy="315" r="300" fill="url(#de-glow)" />

  <!-- source store: stacked layers -->
  <g>
    <rect x="110" y="150" width="270" height="46" rx="10" fill="#38bdf8" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="2" />
    <rect x="110" y="208" width="270" height="46" rx="10" fill="#38bdf8" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="2" />
    <rect x="110" y="266" width="270" height="46" rx="10" fill="#38bdf8" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="2" />
    <rect x="110" y="324" width="270" height="46" rx="10" fill="#38bdf8" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="2" />
    <rect x="110" y="382" width="270" height="46" rx="10" fill="#38bdf8" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="2" />
    <rect x="110" y="440" width="270" height="46" rx="10" fill="#38bdf8" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="2" />
  </g>

  <!-- the export gate -->
  <rect x="540" y="120" width="26" height="396" rx="13" fill="#fbbf24" fill-opacity="0.85" />
  <rect x="540" y="240" width="26" height="52" rx="13" fill="#0a0f1d" />
  <rect x="540" y="358" width="26" height="52" rx="13" fill="#0a0f1d" />

  <!-- survives: continuous lines -->
  <g stroke="#34d399" stroke-opacity="0.8" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 390 173 L 528 262" />
    <path d="M 390 231 L 528 272" />
    <path d="M 390 405 L 528 380" />
    <path d="M 390 463 L 528 392" />
    <path d="M 578 268 L 760 210" />
    <path d="M 578 282 L 760 268" />
    <path d="M 578 376 L 760 326" />
    <path d="M 578 388 L 760 384" />
  </g>

  <!-- lost at the boundary -->
  <g stroke="#f87171" stroke-opacity="0.8" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="8 9">
    <path d="M 390 289 L 520 315" />
    <path d="M 390 347 L 520 330" />
  </g>
  <g stroke="#f87171" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round">
    <path d="M 512 306 l 18 18 M 530 306 l -18 18" />
    <path d="M 512 321 l 18 18 M 530 321 l -18 18" />
  </g>

  <!-- destination: what arrived -->
  <g>
    <rect x="790" y="188" width="250" height="44" rx="10" fill="#34d399" fill-opacity="0.20" stroke="#34d399" stroke-opacity="0.6" stroke-width="2" />
    <rect x="790" y="246" width="250" height="44" rx="10" fill="#34d399" fill-opacity="0.20" stroke="#34d399" stroke-opacity="0.6" stroke-width="2" />
    <rect x="790" y="304" width="250" height="44" rx="10" fill="#34d399" fill-opacity="0.20" stroke="#34d399" stroke-opacity="0.6" stroke-width="2" />
    <rect x="790" y="362" width="250" height="44" rx="10" fill="#34d399" fill-opacity="0.20" stroke="#34d399" stroke-opacity="0.6" stroke-width="2" />
    <!-- the two gaps that did not arrive -->
    <rect x="790" y="420" width="250" height="44" rx="10" fill="none" stroke="#f87171" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 8" />
    <rect x="790" y="130" width="250" height="44" rx="10" fill="none" stroke="#f87171" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 8" />
  </g>
</svg>
