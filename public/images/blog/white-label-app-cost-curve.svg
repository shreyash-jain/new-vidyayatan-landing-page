<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Chart comparing five-year cumulative cost. The build path starts with a large one-time cost then rises steadily with annual maintenance. The licence path starts near zero and rises gently. The build path stays far above the licence path across all five years.">
  <rect width="880" height="440" fill="#ffffff" />

  <text x="36" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#2b2e7c">Five years, cumulative</text>
  <text x="36" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#6b7194">The build starts high and never stops rising. Maintenance is the half that gets left out.</text>

  <!-- plot frame -->
  <line x1="90" y1="110" x2="90" y2="352" stroke="#2b2e7c" stroke-opacity="0.25" stroke-width="2" />
  <line x1="90" y1="352" x2="820" y2="352" stroke="#2b2e7c" stroke-opacity="0.25" stroke-width="2" />

  <!-- gridlines -->
  <g stroke="#2b2e7c" stroke-opacity="0.08" stroke-width="1">
    <line x1="90" y1="292" x2="820" y2="292" />
    <line x1="90" y1="232" x2="820" y2="232" />
    <line x1="90" y1="172" x2="820" y2="172" />
    <line x1="90" y1="112" x2="820" y2="112" />
  </g>

  <!-- x labels -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#6b7194" text-anchor="middle">
    <text x="90" y="376">ship</text>
    <text x="236" y="376">yr 1</text>
    <text x="382" y="376">yr 2</text>
    <text x="528" y="376">yr 3</text>
    <text x="674" y="376">yr 4</text>
    <text x="820" y="376">yr 5</text>
  </g>

  <!-- build path: jumps at ship, then climbs -->
  <path d="M 90 352 L 90 196 L 236 172 L 382 148 L 528 130 L 674 118 L 820 112"
        fill="none" stroke="#fbbf24" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
  <g fill="#fbbf24">
    <circle cx="90" cy="196" r="6" /><circle cx="236" cy="172" r="6" /><circle cx="382" cy="148" r="6" />
    <circle cx="528" cy="130" r="6" /><circle cx="674" cy="118" r="6" /><circle cx="820" cy="112" r="6" />
  </g>

  <!-- licence path: low, gentle -->
  <path d="M 90 352 L 236 338 L 382 324 L 528 310 L 674 296 L 820 282"
        fill="none" stroke="#1677ff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
  <g fill="#1677ff">
    <circle cx="236" cy="338" r="6" /><circle cx="382" cy="324" r="6" /><circle cx="528" cy="310" r="6" />
    <circle cx="674" cy="296" r="6" /><circle cx="820" cy="282" r="6" />
  </g>

  <!-- the build jump, annotated -->
  <path d="M 66 352 L 66 196" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="5 5" />
  <text x="106" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#92400e">one-time build lands before a single user opens it</text>

  <!-- legend -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
    <rect x="90" y="400" width="22" height="4" rx="2" fill="#fbbf24" />
    <text x="122" y="406" fill="#2b2e7c">Build: one-time cost, then 15–25% a year to stand still</text>
    <rect x="512" y="400" width="22" height="4" rx="2" fill="#1677ff" />
    <text x="544" y="406" fill="#2b2e7c">Licence: apps bundled above a tier</text>
  </g>
</svg>
