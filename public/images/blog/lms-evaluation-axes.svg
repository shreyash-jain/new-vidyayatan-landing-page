<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="A scoring sheet listing the eight evaluation axes. Each axis is scored zero to three, then multiplied by a weight. The weight columns show that a coaching institute weights peak load and the money path most heavily, a school weights reach most heavily, and a corporate training team weights extension surface most heavily.">
  <rect width="880" height="560" fill="#ffffff" />

  <text x="36" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#2b2e7c">Score 0–3, then weight it</text>
  <text x="36" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#6b7194">The axes stay the same. The weights are what make it your decision.</text>

  <!-- column headers -->
  <text x="470" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6b7194" letter-spacing="1.2">SCORE</text>
  <text x="628" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6b7194" letter-spacing="1.2">COACHING</text>
  <text x="722" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6b7194" letter-spacing="1.2">SCHOOL</text>
  <text x="816" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6b7194" letter-spacing="1.2">CORPORATE</text>
  <rect x="36" y="130" width="808" height="1.5" fill="#2b2e7c" fill-opacity="0.25" />

  <!-- rows: label, four score cells, three weight numbers -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#2b2e7c">
    <text x="36" y="167">1 · Peak-load behaviour</text>
    <text x="36" y="217">2 · Data exit</text>
    <text x="36" y="267">3 · The money path</text>
    <text x="36" y="317">4 · One learner record</text>
    <text x="36" y="367">5 · Reach</text>
    <text x="36" y="417">6 · Admin load</text>
    <text x="36" y="467">7 · Extension surface</text>
    <text x="36" y="517">8 · Change cost</text>
  </g>

  <!-- score pips: four per row, hollow -->
  <g stroke="#1677ff" stroke-opacity="0.45" stroke-width="1.5" fill="#ffffff">
    <circle cx="416" cy="162" r="8" /><circle cx="452" cy="162" r="8" /><circle cx="488" cy="162" r="8" /><circle cx="524" cy="162" r="8" />
    <circle cx="416" cy="212" r="8" /><circle cx="452" cy="212" r="8" /><circle cx="488" cy="212" r="8" /><circle cx="524" cy="212" r="8" />
    <circle cx="416" cy="262" r="8" /><circle cx="452" cy="262" r="8" /><circle cx="488" cy="262" r="8" /><circle cx="524" cy="262" r="8" />
    <circle cx="416" cy="312" r="8" /><circle cx="452" cy="312" r="8" /><circle cx="488" cy="312" r="8" /><circle cx="524" cy="312" r="8" />
    <circle cx="416" cy="362" r="8" /><circle cx="452" cy="362" r="8" /><circle cx="488" cy="362" r="8" /><circle cx="524" cy="362" r="8" />
    <circle cx="416" cy="412" r="8" /><circle cx="452" cy="412" r="8" /><circle cx="488" cy="412" r="8" /><circle cx="524" cy="412" r="8" />
    <circle cx="416" cy="462" r="8" /><circle cx="452" cy="462" r="8" /><circle cx="488" cy="462" r="8" /><circle cx="524" cy="462" r="8" />
    <circle cx="416" cy="512" r="8" /><circle cx="452" cy="512" r="8" /><circle cx="488" cy="512" r="8" /><circle cx="524" cy="512" r="8" />
  </g>

  <!-- weight numbers; the heaviest weight in each profile column is filled -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" text-anchor="middle">
    <!-- coaching column: 20 / 10 / 20 / 15 / 15 / 10 / 5 / 5 -->
    <rect x="606" y="148" width="44" height="24" rx="6" fill="#1677ff" fill-opacity="0.12" />
    <text x="628" y="166" fill="#1677ff" font-weight="700">20</text>
    <text x="628" y="216" fill="#6b7194">10</text>
    <rect x="606" y="248" width="44" height="24" rx="6" fill="#1677ff" fill-opacity="0.12" />
    <text x="628" y="266" fill="#1677ff" font-weight="700">20</text>
    <text x="628" y="316" fill="#6b7194">15</text>
    <text x="628" y="366" fill="#6b7194">15</text>
    <text x="628" y="416" fill="#6b7194">10</text>
    <text x="628" y="466" fill="#6b7194">5</text>
    <text x="628" y="516" fill="#6b7194">5</text>

    <!-- school column: 10 / 15 / 20 / 15 / 20 / 10 / 5 / 5 -->
    <text x="722" y="166" fill="#6b7194">10</text>
    <text x="722" y="216" fill="#6b7194">15</text>
    <rect x="700" y="248" width="44" height="24" rx="6" fill="#1677ff" fill-opacity="0.12" />
    <text x="722" y="266" fill="#1677ff" font-weight="700">20</text>
    <text x="722" y="316" fill="#6b7194">15</text>
    <rect x="700" y="348" width="44" height="24" rx="6" fill="#1677ff" fill-opacity="0.12" />
    <text x="722" y="366" fill="#1677ff" font-weight="700">20</text>
    <text x="722" y="416" fill="#6b7194">10</text>
    <text x="722" y="466" fill="#6b7194">5</text>
    <text x="722" y="516" fill="#6b7194">5</text>

    <!-- corporate column: 5 / 15 / 5 / 10 / 10 / 15 / 25 / 15 -->
    <text x="816" y="166" fill="#6b7194">5</text>
    <text x="816" y="216" fill="#6b7194">15</text>
    <text x="816" y="266" fill="#6b7194">5</text>
    <text x="816" y="316" fill="#6b7194">10</text>
    <text x="816" y="366" fill="#6b7194">10</text>
    <text x="816" y="416" fill="#6b7194">15</text>
    <rect x="794" y="448" width="44" height="24" rx="6" fill="#1677ff" fill-opacity="0.12" />
    <text x="816" y="466" fill="#1677ff" font-weight="700">25</text>
    <text x="816" y="516" fill="#6b7194">15</text>
  </g>

  <!-- row rules -->
  <g fill="#2b2e7c" fill-opacity="0.09">
    <rect x="36" y="184" width="808" height="1" />
    <rect x="36" y="234" width="808" height="1" />
    <rect x="36" y="284" width="808" height="1" />
    <rect x="36" y="334" width="808" height="1" />
    <rect x="36" y="384" width="808" height="1" />
    <rect x="36" y="434" width="808" height="1" />
    <rect x="36" y="484" width="808" height="1" />
  </g>
</svg>
