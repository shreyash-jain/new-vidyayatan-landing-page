<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="Business intelligence looks back and answers what happened, such as last quarter's sales and best-selling products. Predictive analytics looks ahead and answers what is likely next, such as next quarter's sales, customers likely to leave and stock likely to run short.">
  <rect width="880" height="450" fill="#ffffff" />
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7194"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">Looking back vs looking ahead</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">Business intelligence and predictive analytics answer different questions</text>
<rect x="30" y="108" width="385" height="240" rx="12" fill="#eef0fb" stroke="#2b2e7c" stroke-width="2"/><text x="222" y="148" font-size="24" font-weight="700" fill="#2b2e7c" text-anchor="middle">Business intelligence</text><text x="222" y="180" font-size="18" font-weight="600" fill="#6b7194" text-anchor="middle">Looks back: what happened?</text><circle cx="62" cy="217" r="5" fill="#2b2e7c"/><text x="78" y="222" font-size="18" font-weight="400" fill="#2b2e7c" text-anchor="start">Last quarter's sales by region</text><circle cx="62" cy="253" r="5" fill="#2b2e7c"/><text x="78" y="258" font-size="18" font-weight="400" fill="#2b2e7c" text-anchor="start">Which products sold best</text><circle cx="62" cy="289" r="5" fill="#2b2e7c"/><text x="78" y="294" font-size="18" font-weight="400" fill="#2b2e7c" text-anchor="start">Where customers dropped off</text><rect x="465" y="108" width="385" height="240" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="657" y="148" font-size="24" font-weight="700" fill="#047857" text-anchor="middle">Predictive analytics</text><text x="657" y="180" font-size="18" font-weight="600" fill="#6b7194" text-anchor="middle">Looks ahead: what is likely next?</text><circle cx="497" cy="217" r="5" fill="#047857"/><text x="513" y="222" font-size="18" font-weight="400" fill="#047857" text-anchor="start">Next quarter's likely sales</text><circle cx="497" cy="253" r="5" fill="#047857"/><text x="513" y="258" font-size="18" font-weight="400" fill="#047857" text-anchor="start">Which customers may leave</text><circle cx="497" cy="289" r="5" fill="#047857"/><text x="513" y="294" font-size="18" font-weight="400" fill="#047857" text-anchor="start">Which stock may run short</text><path d="M418,228 H460" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/><rect x="30" y="368" width="820" height="52" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="440" y="401" font-size="19" font-weight="600" fill="#b45309" text-anchor="middle">Use both: BI shows where you stand, predictions show where you are heading</text>
  </g>
</svg>
