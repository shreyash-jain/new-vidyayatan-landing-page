<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" role="img" aria-label="Generative AI as an infrastructure layer: one language-model capability at the bottom feeds five business workflows — knowledge operations, software delivery, data analysis, personalisation and process automation — while the chatbot sits on top as one thin interface among many.">
  <rect width="880" height="610" fill="#ffffff" />

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c">One model, many jobs</text>
    <text x="30" y="74" font-size="18" fill="#6b7194">Where the budget goes, versus where the model actually pays off.</text>

    <!-- top: the chatbot, a small chip -->
    <rect x="290" y="104" width="300" height="56" rx="12" fill="#fff7e0" stroke="#fbbf24" stroke-width="1.5" />
    <text x="440" y="128" font-size="19" font-weight="700" fill="#2b2e7c" text-anchor="middle">The chatbot</text>
    <text x="440" y="150" font-size="17" fill="#6b7194" text-anchor="middle">one interface · most of the budget</text>

    <!-- arrow from chip down to the row -->
    <path d="M440 160 V196" stroke="#2b2e7c" stroke-opacity="0.25" stroke-width="2" fill="none" />
    <path d="M434 190 L440 200 L446 190 Z" fill="#2b2e7c" fill-opacity="0.35" />

    <!-- middle: five workflow cards -->
    <g>
      <rect x="30" y="212" width="156" height="200" rx="12" fill="#f6f7fb" stroke="#2b2e7c" stroke-opacity="0.12" />
      <rect x="30" y="212" width="156" height="5" rx="2.5" fill="#1677ff" />
      <text x="46" y="250" font-size="19" font-weight="700" fill="#2b2e7c">Knowledge</text>
      <text x="46" y="274" font-size="19" font-weight="700" fill="#2b2e7c">operations</text>
      <text x="46" y="306" font-size="17" fill="#6b7194">The guides and</text>
      <text x="46" y="330" font-size="17" fill="#6b7194">help articles</text>
      <text x="46" y="354" font-size="17" fill="#6b7194">nobody ever</text>
      <text x="46" y="378" font-size="17" fill="#6b7194">got round to.</text>

      <rect x="196" y="212" width="156" height="200" rx="12" fill="#f6f7fb" stroke="#2b2e7c" stroke-opacity="0.12" />
      <rect x="196" y="212" width="156" height="5" rx="2.5" fill="#1677ff" />
      <text x="212" y="250" font-size="19" font-weight="700" fill="#2b2e7c">Software</text>
      <text x="212" y="274" font-size="19" font-weight="700" fill="#2b2e7c">delivery</text>
      <text x="212" y="306" font-size="17" fill="#6b7194">Tests for old</text>
      <text x="212" y="330" font-size="17" fill="#6b7194">code, notes on</text>
      <text x="212" y="354" font-size="17" fill="#6b7194">the system no</text>
      <text x="212" y="378" font-size="17" fill="#6b7194">one understands.</text>

      <rect x="362" y="212" width="156" height="200" rx="12" fill="#f6f7fb" stroke="#2b2e7c" stroke-opacity="0.12" />
      <rect x="362" y="212" width="156" height="5" rx="2.5" fill="#1677ff" />
      <text x="378" y="250" font-size="19" font-weight="700" fill="#2b2e7c">Data</text>
      <text x="378" y="274" font-size="19" font-weight="700" fill="#2b2e7c">analysis</text>
      <text x="378" y="306" font-size="17" fill="#6b7194">Plain-English</text>
      <text x="378" y="330" font-size="17" fill="#6b7194">questions, safe</text>
      <text x="378" y="354" font-size="17" fill="#6b7194">test data, written</text>
      <text x="378" y="378" font-size="17" fill="#6b7194">forecasts.</text>

      <rect x="528" y="212" width="156" height="200" rx="12" fill="#f6f7fb" stroke="#2b2e7c" stroke-opacity="0.12" />
      <rect x="528" y="212" width="156" height="5" rx="2.5" fill="#1677ff" />
      <text x="544" y="250" font-size="19" font-weight="700" fill="#2b2e7c">Personal-</text>
      <text x="544" y="274" font-size="19" font-weight="700" fill="#2b2e7c">isation</text>
      <text x="544" y="306" font-size="17" fill="#6b7194">Product pages</text>
      <text x="544" y="330" font-size="17" fill="#6b7194">and emails written</text>
      <text x="544" y="354" font-size="17" fill="#6b7194">for each customer,</text>
      <text x="544" y="378" font-size="17" fill="#6b7194">fact-checked.</text>

      <rect x="694" y="212" width="156" height="200" rx="12" fill="#f6f7fb" stroke="#2b2e7c" stroke-opacity="0.12" />
      <rect x="694" y="212" width="156" height="5" rx="2.5" fill="#1677ff" />
      <text x="710" y="250" font-size="19" font-weight="700" fill="#2b2e7c">Process</text>
      <text x="710" y="274" font-size="19" font-weight="700" fill="#2b2e7c">automation</text>
      <text x="710" y="306" font-size="17" fill="#6b7194">Contract clauses,</text>
      <text x="710" y="330" font-size="17" fill="#6b7194">tender drafts,</text>
      <text x="710" y="354" font-size="17" fill="#6b7194">onboarding packs</text>
      <text x="710" y="378" font-size="17" fill="#6b7194">from real policy.</text>
    </g>

    <!-- arrows from base up into cards -->
    <g stroke="#1677ff" stroke-opacity="0.45" stroke-width="2" fill="none">
      <path d="M108 470 V420 M274 470 V420 M440 470 V420 M606 470 V420 M772 470 V420" />
    </g>
    <g fill="#1677ff" fill-opacity="0.6">
      <path d="M102 426 L108 416 L114 426 Z" /><path d="M268 426 L274 416 L280 426 Z" />
      <path d="M434 426 L440 416 L446 426 Z" /><path d="M600 426 L606 416 L612 426 Z" />
      <path d="M766 426 L772 416 L778 426 Z" />
    </g>

    <!-- base: the model -->
    <rect x="30" y="470" width="820" height="96" rx="14" fill="#2b2e7c" />
    <text x="440" y="510" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">The language model — the cheap, commodity part</text>
    <text x="440" y="540" font-size="17" fill="#c7d2fe" text-anchor="middle">Reads · summarises · drafts · sorts · checks · talks to your other software</text>

    <!-- footnote -->
    <text x="30" y="595" font-size="15" fill="#6b7194">One answer got ~280× cheaper from Nov 2022 to Oct 2024 (Stanford AI Index 2025) — cheap enough for every ticket.</text>
  </g>
</svg>
