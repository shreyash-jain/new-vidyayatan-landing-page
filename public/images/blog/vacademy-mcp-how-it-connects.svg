ht="400" fill="#6b7194" text-anchor="middle">Courses and learners</text><rect x="622" y="262" width="206" height="70" rx="8" fill="#fff" stroke="#2b2e7c" stroke-width="2"/><text x="725" y="292" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="middle">CRM</text><text x="725" y="318" font-size="16" font-weight="400" fill="#6b7194" text-anchor="middle">Leads, calls, follow-ups</text><rect x="30" y="372" width="820" height="52" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="440" y="405" font-size="19" font-weight="600" fill="#047857" text-anchor="middle">Limited to your institute and the staff member who approved it</text>
