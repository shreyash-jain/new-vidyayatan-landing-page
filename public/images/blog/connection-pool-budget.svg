<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Diagram of the four connection limits between an application and its database: the sum of all application pools, the pooler's server pool, the database role's connection limit, and the database max_connections. The bars show the sum of application pools exceeding the pooler's server pool, which is the limit that actually binds.">
  <rect width="880" height="470" fill="#ffffff" />

  <text x="36" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#2b2e7c">Four ceilings, and you hit the lowest</text>
  <text x="36" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#6b7194">Each is set in a different file, by a different person. They have to agree.</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- row 1: sum of app pools — overflowing -->
    <text x="36" y="140" font-size="16" font-weight="600" fill="#2b2e7c">Sum of application pools</text>
    <text x="36" y="162" font-size="13" fill="#6b7194">every service added together</text>
    <rect x="330" y="122" width="470" height="42" rx="10" fill="#f87171" fill-opacity="0.18" stroke="#f87171" stroke-width="2" />
    <text x="812" y="149" font-size="14" font-weight="700" fill="#b91c1c">over</text>

    <!-- row 2: pooler server pool — the binding one -->
    <text x="36" y="216" font-size="16" font-weight="600" fill="#2b2e7c">Pooler server pool</text>
    <text x="36" y="238" font-size="13" fill="#6b7194">what it will actually hand out</text>
    <rect x="330" y="198" width="330" height="42" rx="10" fill="#fbbf24" fill-opacity="0.30" stroke="#fbbf24" stroke-width="2.5" />
    <text x="676" y="225" font-size="13" font-weight="700" fill="#92400e" letter-spacing="0.5">BINDS</text>

    <!-- row 3: role connection limit -->
    <text x="36" y="292" font-size="16" font-weight="600" fill="#2b2e7c">Role connection limit</text>
    <text x="36" y="314" font-size="13" fill="#6b7194">per database user — easy to forget</text>
    <rect x="330" y="274" width="390" height="42" rx="10" fill="#1677ff" fill-opacity="0.12" stroke="#1677ff" stroke-opacity="0.5" stroke-width="2" />

    <!-- row 4: max_connections -->
    <text x="36" y="368" font-size="16" font-weight="600" fill="#2b2e7c">Database max connections</text>
    <text x="36" y="390" font-size="13" fill="#6b7194">the one everyone checks first</text>
    <rect x="330" y="350" width="440" height="42" rx="10" fill="#1677ff" fill-opacity="0.12" stroke="#1677ff" stroke-opacity="0.5" stroke-width="2" />
  </g>

  <!-- the binding line -->
  <path d="M 660 112 L 660 402" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="7 6" />

  <rect x="36" y="418" width="808" height="36" rx="10" fill="#f8fafc" stroke="#2b2e7c" stroke-opacity="0.18" stroke-width="2" />
  <text x="58" y="441" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#2b2e7c">Redo this arithmetic whenever any one service changes its pool size — and check it survives a full restart cascade.</text>
</svg>
