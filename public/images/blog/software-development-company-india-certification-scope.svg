<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="A diagram comparing what an ISO 27001 certificate declares against what a client project actually involves. The certificate covers named units and locations, a defined set of assets and the controls in the Statement of Applicability, valid for a stated period. The project involves the specific engineers assigned, the client's own repositories and cloud accounts, subcontractors and freelancers, and laptops outside the certified sites. The overlap is what the scope statement covers; everything outside it is the buyer's question to ask.">
  <rect width="880" height="470" fill="#ffffff" />

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c">A certificate has edges. Read them.</text>
    <text x="30" y="74" font-size="18" fill="#6b7194">What ISO 27001 declares, against what your project actually touches.</text>

    <!-- left panel: what the certificate covers -->
    <rect x="30" y="106" width="392" height="266" rx="10" fill="#1677ff" fill-opacity="0.07" stroke="#1677ff" stroke-opacity="0.28" stroke-width="1.5" />
    <text x="52" y="140" font-size="20" font-weight="700" fill="#1e3a8a">On the certificate</text>

    <g font-size="18" fill="#1f2340">
      <circle cx="60" cy="176" r="4" fill="#1677ff" />
      <text x="76" y="182">The units and locations named</text>
      <text x="76" y="204">in the scope statement</text>

      <circle cx="60" cy="238" r="4" fill="#1677ff" />
      <text x="76" y="244">The controls in the Statement</text>
      <text x="76" y="266">of Applicability</text>

      <circle cx="60" cy="300" r="4" fill="#1677ff" />
      <text x="76" y="306">A validity period, and the body</text>
      <text x="76" y="328">that issued it</text>
    </g>

    <!-- right panel: what the project touches -->
    <rect x="458" y="106" width="392" height="266" rx="10" fill="#fbbf24" fill-opacity="0.13" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5" />
    <text x="480" y="140" font-size="20" font-weight="700" fill="#92400e">On your project</text>

    <g font-size="18" fill="#1f2340">
      <circle cx="488" cy="176" r="4" fill="#d97706" />
      <text x="504" y="182">The engineers actually assigned</text>
      <text x="504" y="204">to you, wherever they sit</text>

      <circle cx="488" cy="238" r="4" fill="#d97706" />
      <text x="504" y="244">Subcontractors, freelancers</text>
      <text x="504" y="266">and second-tier suppliers</text>

      <circle cx="488" cy="300" r="4" fill="#d97706" />
      <text x="504" y="306">Your repositories, your cloud</text>
      <text x="504" y="328">account, your production data</text>
    </g>

    <!-- the seam -->
    <line x1="440" y1="118" x2="440" y2="360" stroke="#2b2e7c" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="6 6" />

    <!-- the question that closes the gap -->
    <rect x="30" y="396" width="820" height="50" rx="10" fill="#2b2e7c" fill-opacity="0.06" />
    <text x="52" y="427" font-size="19" font-weight="600" fill="#2b2e7c">Ask one question: does the scope on the certificate contain the team that will do my work?</text>
  </g>
</svg>
