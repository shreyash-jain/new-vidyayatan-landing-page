<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="Six areas of business operations that AI agents are changing, with what the agent does and what stays with a person: workflows, support, sales, marketing, finance and decisions.">
  <rect width="880" height="450" fill="#ffffff" />
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7194"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">Six areas of operations agents are changing</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">What the agent does, and what stays with a person</text>
<rect x="30" y="100" width="260" height="160" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="48" y="136" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">1  Workflows</text><text x="48" y="166" font-size="14" font-weight="700" fill="#0ea5e9" text-anchor="start">AGENT</text><text x="48" y="188" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Routes approvals, chases delays</text><text x="48" y="216" font-size="14" font-weight="700" fill="#b45309" text-anchor="start">PERSON</text><text x="48" y="238" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Signs off the exceptions</text>
<rect x="310" y="100" width="260" height="160" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="328" y="136" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">2  Support</text><text x="328" y="166" font-size="14" font-weight="700" fill="#0ea5e9" text-anchor="start">AGENT</text><text x="328" y="188" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Resolves routine enquiries</text><text x="328" y="216" font-size="14" font-weight="700" fill="#b45309" text-anchor="start">PERSON</text><text x="328" y="238" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Takes the complaints</text>
<rect x="590" y="100" width="260" height="160" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="608" y="136" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">3  Sales</text><text x="608" y="166" font-size="14" font-weight="700" fill="#0ea5e9" text-anchor="start">AGENT</text><text x="608" y="188" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Qualifies and follows up</text><text x="608" y="216" font-size="14" font-weight="700" fill="#b45309" text-anchor="start">PERSON</text><text x="608" y="238" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Closes the deal</text>
<rect x="30" y="275" width="260" height="160" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="48" y="311" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">4  Marketing</text><text x="48" y="341" font-size="14" font-weight="700" fill="#0ea5e9" text-anchor="start">AGENT</text><text x="48" y="363" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Builds reports, nurtures leads</text><text x="48" y="391" font-size="14" font-weight="700" fill="#b45309" text-anchor="start">PERSON</text><text x="48" y="413" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Owns the message</text>
<rect x="310" y="275" width="260" height="160" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="328" y="311" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">5  Finance</text><text x="328" y="341" font-size="14" font-weight="700" fill="#0ea5e9" text-anchor="start">AGENT</text><text x="328" y="363" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Matches invoices to orders</text><text x="328" y="391" font-size="14" font-weight="700" fill="#b45309" text-anchor="start">PERSON</text><text x="328" y="413" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Approves the payment</text>
<rect x="590" y="275" width="260" height="160" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="608" y="311" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">6  Decisions</text><text x="608" y="341" font-size="14" font-weight="700" fill="#0ea5e9" text-anchor="start">AGENT</text><text x="608" y="363" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Spots patterns in the data</text><text x="608" y="391" font-size="14" font-weight="700" fill="#b45309" text-anchor="start">PERSON</text><text x="608" y="413" font-size="16" font-weight="400" fill="#6b7194" text-anchor="start">Decides what to do</text>

  </g>
</svg>
