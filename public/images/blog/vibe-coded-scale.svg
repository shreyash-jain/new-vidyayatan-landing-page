<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="200" r="180" fill="url(#glow-grad)" filter="url(#glow)" />
  <circle cx="950" cy="420" r="220" fill="url(#glow-grad)" filter="url(#glow)" />

  <!-- Left: Vibe Code Prototype Box (Chaotic / Monolith) -->
  <g transform="translate(100, 160)">
    <rect width="320" height="300" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="2" />
    <rect width="320" height="44" rx="16" fill="#1e293b" />
    <circle cx="30" cy="22" r="6" fill="#ef4444" />
    <circle cx="50" cy="22" r="6" fill="#f59e0b" />
    <circle cx="70" cy="22" r="6" fill="#10b981" />
    <text x="100" y="27" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">Vibe Prototype (10x Wall)</text>
    
    <!-- Code Lines -->
    <rect x="25" y="70" width="180" height="10" rx="3" fill="#f43f5e" fill-opacity="0.8" />
    <rect x="25" y="95" width="250" height="10" rx="3" fill="#94a3b8" fill-opacity="0.4" />
    <rect x="25" y="120" width="210" height="10" rx="3" fill="#94a3b8" fill-opacity="0.4" />
    <rect x="25" y="145" width="270" height="10" rx="3" fill="#f59e0b" fill-opacity="0.7" />
    <rect x="25" y="170" width="160" height="10" rx="3" fill="#94a3b8" fill-opacity="0.4" />
    <rect x="25" y="195" width="230" height="10" rx="3" fill="#f43f5e" fill-opacity="0.8" />

    <rect x="25" y="235" width="270" height="36" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4" />
    <text x="40" y="258" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="600">⚠️ DB Connection Limit Exceeded</text>
  </g>

  <!-- Transform Arrow -->
  <g transform="translate(455, 280)">
    <path d="M0 30 L90 30 M70 10 L95 30 L70 50" stroke="url(#cyan-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="5" y="-15" width="80" height="28" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0369a1" />
    <text x="14" y="4" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">SCALE</text>
  </g>

  <!-- Right: Vidyayatan Architecture (High Availability) -->
  <g transform="translate(580, 130)">
    <!-- Container -->
    <rect width="520" height="360" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#0284c7" stroke-width="2" />
    <rect width="520" height="48" rx="20" fill="#1e293b" />
    <circle cx="35" cy="24" r="6" fill="#38bdf8" />
    <text x="60" y="29" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Vidyayatan Scaled Architecture</text>
    <rect x="380" y="14" width="115" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="395" y="29" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">● 99.99% UPTIME</text>

    <!-- Edge CDN Node -->
    <rect x="30" y="80" width="140" height="70" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="45" y="110" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="700">Cloudflare Edge</text>
    <text x="45" y="130" fill="#64748b" font-family="sans-serif" font-size="11">Global CDN &amp; WAF</text>

    <!-- Redis Cache -->
    <rect x="190" y="80" width="140" height="70" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="205" y="110" fill="#67e8f9" font-family="sans-serif" font-size="13" font-weight="700">Redis Cache</text>
    <text x="205" y="130" fill="#64748b" font-family="sans-serif" font-size="11">&lt;5ms Read Cache</text>

    <!-- BullMQ Async Queue -->
    <rect x="350" y="80" width="140" height="70" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="365" y="110" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">BullMQ Workers</text>
    <text x="365" y="130" fill="#64748b" font-family="sans-serif" font-size="11">Async Job Queues</text>

    <!-- DB Connection Pooler & Postgres -->
    <rect x="30" y="180" width="460" height="150" rx="12" fill="#0284c7" fill-opacity="0.08" stroke="#0369a1" stroke-opacity="0.4" />
    <text x="50" y="210" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">PostgreSQL + PgBouncer Connection Pool</text>
    
    <g transform="translate(50, 230)">
      <rect width="120" height="80" rx="8" fill="#1e293b" stroke="#10b981" />
      <text x="15" y="35" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Primary DB</text>
      <text x="15" y="55" fill="#34d399" font-family="sans-serif" font-size="10">Write Pool</text>
    </g>
    <g transform="translate(190, 230)">
      <rect width="120" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" />
      <text x="15" y="35" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Read Replica 1</text>
      <text x="15" y="55" fill="#60a5fa" font-family="sans-serif" font-size="10">Query Offload</text>
    </g>
    <g transform="translate(330, 230)">
      <rect width="120" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" />
      <text x="15" y="35" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Read Replica 2</text>
      <text x="15" y="55" fill="#60a5fa" font-family="sans-serif" font-size="10">Query Offload</text>
    </g>
  </g>

  <!-- Title Banner -->
  <text x="600" y="580" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="600">Vidyayatan Engineering • How to Scale Your Vibe Coded App</text>
</svg>
