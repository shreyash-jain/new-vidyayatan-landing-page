<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="A six-stage sales pipeline: new lead, scored 0 to 100 and sent to a rep on shift; contacted, with an AI call in minutes and WhatsApp if no answer; qualified, with answers saved on the lead&#x27;s record; proposal, where a timer shows if the rep has gone quiet; negotiation, where stalled deals stand out for the manager; and won or lost, where the result feeds the conversion reports.">
  <rect width="880" height="470" fill="#ffffff" />
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7194"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">The sales pipeline, and what the CRM does at each stage</text>
    <text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">Each stage is one step closer to a signed deal</text>
    <rect x="30" y="104" width="250" height="150" rx="12" fill="#f0f9ff"/>
    <circle cx="66" cy="144" r="20" fill="#0ea5e9"/>
    <text x="66" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="98" y="151" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">New lead</text>
    <text x="50" y="200" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">Scored 0–100 and sent</text>
    <text x="50" y="228" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">to a rep on shift</text>
    <line x1="284" y1="179" x2="310" y2="179" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>
    <rect x="315" y="104" width="250" height="150" rx="12" fill="#f0f9ff"/>
    <circle cx="351" cy="144" r="20" fill="#0ea5e9"/>
    <text x="351" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="383" y="151" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Contacted</text>
    <text x="335" y="200" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">AI call in minutes,</text>
    <text x="335" y="228" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">WhatsApp if no answer</text>
    <line x1="569" y1="179" x2="595" y2="179" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>
    <rect x="600" y="104" width="250" height="150" rx="12" fill="#f0f9ff"/>
    <circle cx="636" cy="144" r="20" fill="#0ea5e9"/>
    <text x="636" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="668" y="151" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Qualified</text>
    <text x="620" y="200" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">Answers saved on</text>
    <text x="620" y="228" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">the lead&#x27;s record</text>
    <rect x="30" y="294" width="250" height="150" rx="12" fill="#fffbeb"/>
    <circle cx="66" cy="334" r="20" fill="#f59e0b"/>
    <text x="66" y="341" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text x="98" y="341" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Proposal</text>
    <text x="50" y="390" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">Timer shows if the</text>
    <text x="50" y="418" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">rep has gone quiet</text>
    <line x1="284" y1="369" x2="310" y2="369" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>
    <rect x="315" y="294" width="250" height="150" rx="12" fill="#fffbeb"/>
    <circle cx="351" cy="334" r="20" fill="#f59e0b"/>
    <text x="351" y="341" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
    <text x="383" y="341" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Negotiation</text>
    <text x="335" y="390" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">Stalled deals stand</text>
    <text x="335" y="418" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">out for the manager</text>
    <line x1="569" y1="369" x2="595" y2="369" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>
    <rect x="600" y="294" width="250" height="150" rx="12" fill="#ecfdf5"/>
    <circle cx="636" cy="334" r="20" fill="#047857"/>
    <text x="636" y="341" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>
    <text x="668" y="341" font-size="21" font-weight="700" fill="#2b2e7c" text-anchor="start">Won / Lost</text>
    <text x="620" y="390" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">Result feeds the</text>
    <text x="620" y="418" font-size="19" font-weight="400" fill="#6b7194" text-anchor="start">conversion reports</text>
    <path d="M780,256 L780,272 L155,272 L155,290" fill="none" stroke="#6b7194" stroke-width="2.5" marker-end="url(#ar)"/>

  </g>
</svg>
