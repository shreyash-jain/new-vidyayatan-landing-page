<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 484" width="880" height="484" role="img" aria-label="Six AI security threats: prompt injection, data leakage through public chatbots, AI phishing and deepfakes, model manipulation, shadow AI, and third-party vendor risk.">
<rect width="880" height="484" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c" text-anchor="start">Six ways AI gets attacked or leaks</text>
<text x="30" y="74" font-size="18" font-weight="400" fill="#6b7194" text-anchor="start">Most of these need no hacker. A tired employee is enough</text><rect x="30" y="100" width="400" height="108" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="68" cy="138" r="20" fill="#f59e0b"/><text x="68" y="146" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="100" y="144" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Prompt injection</text><text x="54" y="172" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">Hidden text tells your AI to ignore</text>
<text x="54" y="192" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">its rules or reveal private data</text><rect x="450" y="100" width="400" height="108" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><circle cx="488" cy="138" r="20" fill="#dc2626"/><text x="488" y="146" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="520" y="144" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Data leakage</text><text x="474" y="172" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">Staff paste contracts or source code</text>
<text x="474" y="192" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">into a public chatbot</text><rect x="30" y="224" width="400" height="108" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><circle cx="68" cy="262" r="20" fill="#dc2626"/><text x="68" y="270" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="100" y="268" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">AI phishing and deepfakes</text><text x="54" y="296" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">Flawless emails. A cloned voice</text>
<text x="54" y="316" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">'approves' a payment</text><rect x="450" y="224" width="400" height="108" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="488" cy="262" r="20" fill="#f59e0b"/><text x="488" y="270" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="520" y="268" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Model manipulation</text><text x="474" y="296" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">Poisoned data or crafted inputs push</text>
<text x="474" y="316" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">the AI's answers off course</text><rect x="30" y="348" width="400" height="108" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="68" cy="386" r="20" fill="#0ea5e9"/><text x="68" y="394" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="100" y="392" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Shadow AI</text><text x="54" y="420" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">Tools nobody approved, quietly</text>
<text x="54" y="440" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">holding company data</text><rect x="450" y="348" width="400" height="108" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><circle cx="488" cy="386" r="20" fill="#0ea5e9"/><text x="488" y="394" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="520" y="392" font-size="20" font-weight="700" fill="#2b2e7c" text-anchor="start">Vendor risk</text><text x="474" y="420" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">Your AI supplier's breach</text>
<text x="474" y="440" font-size="15.5" font-weight="400" fill="#6b7194" text-anchor="start">becomes your breach</text>
</g>
</svg>
