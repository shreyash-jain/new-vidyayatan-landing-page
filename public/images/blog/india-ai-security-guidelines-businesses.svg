<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Banner: India's new AI security rules in plain English. Three cards: Law (DPDP Act, IT Act, CERT-In 2022), Guidance (MeitY, ISO 42001, NIST) and New (CERT-In AI audit guidelines, November 2026).">
<rect width="1200" height="630" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2e7c"/><stop offset="1" stop-color="#1b1d52"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#g)"/>
<circle cx="1080" cy="90" r="220" fill="#ffffff" fill-opacity="0.04"/><circle cx="120" cy="560" r="180" fill="#ffffff" fill-opacity="0.04"/>
<text x="600" y="150" font-size="22" font-weight="700" fill="#fcd34d" text-anchor="middle">AI SECURITY GUIDELINES INDIA  |  2026</text>
<text x="600" y="250" font-size="70" font-weight="800" fill="#ffffff" text-anchor="middle">India's new AI security</text>
<text x="600" y="332" font-size="70" font-weight="800" fill="#ffffff" text-anchor="middle">rules, in plain English</text>
<text x="600" y="392" font-size="26" font-weight="400" fill="#c7cbf2" text-anchor="middle">What is law, what is guidance, and what to do this quarter</text>
<rect x="170" y="440" width="270" height="78" rx="14" fill="#ffffff"/><rect x="170" y="440" width="8" height="78" rx="4" fill="#047857"/><text x="198" y="474" font-size="22" font-weight="700" fill="#2b2e7c" text-anchor="start">Law</text><text x="198" y="500" font-size="15" font-weight="400" fill="#6b7194" text-anchor="start">DPDP, IT Act, CERT-In 2022</text>
<rect x="460" y="440" width="270" height="78" rx="14" fill="#ffffff"/><rect x="460" y="440" width="8" height="78" rx="4" fill="#0ea5e9"/><text x="488" y="474" font-size="22" font-weight="700" fill="#2b2e7c" text-anchor="start">Guidance</text><text x="488" y="500" font-size="15" font-weight="400" fill="#6b7194" text-anchor="start">MeitY, ISO 42001, NIST</text>
<rect x="750" y="440" width="270" height="78" rx="14" fill="#ffffff"/><rect x="750" y="440" width="8" height="78" rx="4" fill="#f59e0b"/><text x="778" y="474" font-size="22" font-weight="700" fill="#2b2e7c" text-anchor="start">New</text><text x="778" y="500" font-size="15" font-weight="400" fill="#6b7194" text-anchor="start">CERT-In AI audit, Nov 2026</text>
