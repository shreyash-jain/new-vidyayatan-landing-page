<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" role="img" aria-label="Abstract graphic: on the left a single node running fast along one clear path; on the right a new node being woven into a dense mesh of systems that are already connected">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#161431" />
      <stop offset="100%" stop-color="#2b2e7c" />
    </linearGradient>
    <linearGradient id="cs-dash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="cs-glow-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cs-glow-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cs-bg)" />
  <circle cx="300" cy="315" r="270" fill="url(#cs-glow-a)" />
  <circle cx="880" cy="315" r="300" fill="url(#cs-glow-b)" />

  <!-- the seam between the two worlds -->
  <rect x="599" y="90" width="2" height="450" fill="#7dd3fc" fill-opacity="0.18" />

  <!-- LEFT: one path, nothing in the way, momentum -->
  <rect x="120" y="308" width="400" height="14" rx="7" fill="url(#cs-dash)" />
  <g fill="#fbbf24">
    <circle cx="500" cy="315" r="30" />
    <circle cx="500" cy="315" r="52" fill="none" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="2" />
  </g>
  <!-- speed trail behind it -->
  <g fill="#fbbf24">
    <rect x="404" y="266" width="70" height="10" rx="5" fill-opacity="0.55" />
    <rect x="352" y="356" width="110" height="10" rx="5" fill-opacity="0.40" />
    <rect x="286" y="222" width="120" height="8" rx="4" fill-opacity="0.22" />
    <rect x="252" y="404" width="150" height="8" rx="4" fill-opacity="0.16" />
  </g>

  <!-- RIGHT: an existing mesh, already wired together -->
  <g stroke="#7dd3fc" stroke-opacity="0.30" stroke-width="2" fill="none">
    <path d="M 720 190 L 900 150 L 1060 226" />
    <path d="M 720 190 L 806 330 L 900 150" />
    <path d="M 806 330 L 1060 226" />
    <path d="M 806 330 L 940 430 L 1060 226" />
    <path d="M 720 470 L 806 330" />
    <path d="M 720 470 L 940 430" />
    <path d="M 900 150 L 1060 226" />
  </g>
  <g fill="#38bdf8" fill-opacity="0.85">
    <circle cx="720" cy="190" r="19" />
    <circle cx="900" cy="150" r="15" />
    <circle cx="1060" cy="226" r="17" />
    <circle cx="806" cy="330" r="22" />
    <circle cx="940" cy="430" r="16" />
    <circle cx="720" cy="470" r="14" />
  </g>

  <!-- the new piece, being threaded into the mesh -->
  <g>
    <path d="M 806 330 L 662 315" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="3" stroke-dasharray="9 8" fill="none" />
    <path d="M 720 190 L 662 315" stroke="#fbbf24" stroke-opacity="0.40" stroke-width="3" stroke-dasharray="9 8" fill="none" />
    <path d="M 720 470 L 662 315" stroke="#fbbf24" stroke-opacity="0.40" stroke-width="3" stroke-dasharray="9 8" fill="none" />
    <circle cx="662" cy="315" r="21" fill="#fbbf24" />
    <circle cx="662" cy="315" r="34" fill="none" stroke="#fbbf24" stroke-opacity="0.30" stroke-width="2" />
  </g>

  <!-- ground ticks under both halves, implying two different scales -->
  <g fill="#7dd3fc" fill-opacity="0.22">
    <rect x="120" y="540" width="380" height="3" rx="1.5" />
    <rect x="700" y="540" width="380" height="3" rx="1.5" />
  </g>
</svg>
