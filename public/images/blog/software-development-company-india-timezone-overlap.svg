<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="A timeline in UTC comparing an Indian working day of 09:30 to 18:30 IST, which is 04:00 to 13:00 UTC, against a local nine to five in four client markets during northern winter. London overlaps for four hours and five in summer, Berlin for five hours and six in summer, New York for none and San Francisco for none. India does not observe daylight saving, so the window moves twice a year on the client's side, not the vendor's. US overlap has to be bought with an India-side shift, so name who works it in the contract.">
  <rect width="880" height="470" fill="#ffffff" />

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="30" y="44" font-size="30" font-weight="700" fill="#2b2e7c">Where the working day actually overlaps</text>
    <text x="30" y="74" font-size="18" fill="#6b7194">A 09:30–18:30 IST day against a local 09:00–17:00, in northern winter. Hours in UTC.</text>

    <!-- the India window, carried down the chart -->
    <rect x="258" y="112" width="198" height="230" fill="#fbbf24" fill-opacity="0.13" />

    <!-- axis -->
    <g font-size="15" fill="#9aa0bd" text-anchor="middle">
      <text x="170" y="106">00</text>
      <text x="258" y="106">04</text>
      <text x="346" y="106">08</text>
      <text x="434" y="106">12</text>
      <text x="522" y="106">16</text>
      <text x="610" y="106">20</text>
      <text x="698" y="106">24</text>
    </g>
    <g stroke="#2b2e7c" stroke-opacity="0.09" stroke-width="1">
      <line x1="170" y1="112" x2="170" y2="342" />
      <line x1="258" y1="112" x2="258" y2="342" />
      <line x1="346" y1="112" x2="346" y2="342" />
      <line x1="434" y1="112" x2="434" y2="342" />
      <line x1="522" y1="112" x2="522" y2="342" />
      <line x1="610" y1="112" x2="610" y2="342" />
      <line x1="698" y1="112" x2="698" y2="342" />
    </g>

    <!-- India -->
    <text x="156" y="142" font-size="18" font-weight="700" fill="#92400e" text-anchor="end">India</text>
    <rect x="258" y="122" width="198" height="30" rx="6" fill="#fbbf24" />
    <text x="357" y="142" font-size="15" font-weight="700" fill="#7c3f06" text-anchor="middle">09:30–18:30 IST</text>
    <text x="716" y="142" font-size="15" font-weight="600" fill="#6b7194">Overlap</text>

    <line x1="30" y1="170" x2="850" y2="170" stroke="#2b2e7c" stroke-opacity="0.12" stroke-width="1" />

    <!-- London -->
    <text x="156" y="206" font-size="18" font-weight="600" fill="#1f2340" text-anchor="end">London</text>
    <rect x="368" y="186" width="176" height="30" rx="6" fill="#1677ff" fill-opacity="0.55" />
    <text x="716" y="200" font-size="18" font-weight="700" fill="#1e3a8a">4 h</text>
    <text x="716" y="217" font-size="14" fill="#6b7194">5 h in summer</text>

    <!-- Berlin -->
    <text x="156" y="248" font-size="18" font-weight="600" fill="#1f2340" text-anchor="end">Berlin</text>
    <rect x="346" y="228" width="176" height="30" rx="6" fill="#1677ff" fill-opacity="0.55" />
    <text x="716" y="242" font-size="18" font-weight="700" fill="#1e3a8a">5 h</text>
    <text x="716" y="259" font-size="14" fill="#6b7194">6 h in summer</text>

    <!-- New York -->
    <text x="156" y="290" font-size="18" font-weight="600" fill="#1f2340" text-anchor="end">New York</text>
    <rect x="478" y="270" width="176" height="30" rx="6" fill="#1677ff" fill-opacity="0.22" />
    <text x="716" y="290" font-size="18" font-weight="700" fill="#b91c1c">none</text>

    <!-- San Francisco -->
    <text x="156" y="332" font-size="18" font-weight="600" fill="#1f2340" text-anchor="end">San Francisco</text>
    <rect x="544" y="312" width="154" height="30" rx="6" fill="#1677ff" fill-opacity="0.22" />
    <text x="716" y="332" font-size="18" font-weight="700" fill="#b91c1c">none</text>

    <!-- the point -->
    <rect x="30" y="372" width="820" height="64" rx="10" fill="#2b2e7c" fill-opacity="0.06" />
    <text x="52" y="399" font-size="18" fill="#1f2340">India does not observe daylight saving, so the window moves twice a year on your side, not theirs.</text>
    <text x="52" y="423" font-size="18" font-weight="600" fill="#2b2e7c">US overlap has to be bought with an India-side shift. Name who works it, in the contract.</text>
  </g>
</svg>
